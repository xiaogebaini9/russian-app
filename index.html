<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#f5f6fa">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>俄语学习 v6</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f5f6fa;--surface:#fff;--card:#fff;--input:#f0f1f5;
  --border:#e4e6ed;--border2:#dcdee5;
  --blue:#2563eb;--blue2:#3b82f6;--blue-bg:rgba(37,99,235,.06);--blue-bg2:rgba(37,99,235,.12);
  --text:#1a1d26;--text2:#6b7080;--text3:#adb1c0;
  --green:#22c55e;--yellow:#f59e0b;--red:#ef4444;--pink:#fc5c7d;
  --radius:12px;--radius-sm:8px;
  --fs:15px;--fs-sm:13px;--fs-xs:11px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-size:var(--fs);font-family:-apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
input,textarea{font-family:inherit;font-size:inherit;outline:none;background:var(--input);border:1.5px solid var(--border);color:var(--text);border-radius:var(--radius-sm);padding:10px 14px;width:100%;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:none}
::placeholder{color:var(--text3)}
button{cursor:pointer;border:none;outline:none;font-family:inherit;font-size:inherit;background:none;color:inherit;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:2px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:1px}

.app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:480px;margin:0 auto;overflow:hidden}
.header{display:flex;align-items:center;justify-content:center;padding:12px 16px;flex-shrink:0;position:relative}
.header h1{font-size:17px;font-weight:600;letter-spacing:.03em;color:var(--blue)}
.btn-dict{position:absolute;right:12px;top:50%;transform:translateY(-50%);padding:6px 12px;border-radius:16px;font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-bg);border:1px solid transparent;display:flex;align-items:center;gap:3px;text-decoration:none}
.btn-dict:active{background:var(--blue-bg2);border-color:var(--blue)}
.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 12px 8px;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}

/* Nav */
.nav{display:flex;flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);padding:4px 0 calc(4px+env(safe-area-inset-bottom,0px))}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 4px;font-size:10px;color:var(--text3);font-weight:500;transition:color .2s}
.nav-btn .icon{font-size:20px}
.nav-btn.active{color:var(--blue)}
.nav-btn:active .icon{transform:scale(.9)}
.screen{display:none;height:100%;flex-direction:column;padding-top:6px}
.screen.active{display:flex}

/* ═══ DICTIONARY SCREEN ═══ */
.dict-header{display:flex;align-items:center;padding:10px 0;gap:10px;flex-shrink:0}
.dict-back{font-size:18px;padding:6px 10px;border-radius:50%;color:var(--text2);display:flex;align-items:center;justify-content:center}
.dict-back:active{background:var(--blue-bg);color:var(--blue)}
.dict-title{font-weight:600;font-size:15px;color:var(--blue)}
.dict-input-wrap{position:relative;flex-shrink:0;margin-bottom:10px}
.dict-input-wrap input{padding:12px 44px 12px 16px;font-size:16px;background:var(--surface);border-radius:var(--radius)}
.dict-search-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:600}
.dict-search-btn:active{opacity:.8}
.dict-result{flex:1;overflow-y:auto;min-height:0}
.dict-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:8px;animation:fadeIn .25s ease}
.dict-word{font-size:24px;font-weight:600;color:var(--text);margin-bottom:2px}
.dict-word .stress{color:var(--red);font-size:13px;margin-left:6px;font-weight:400}
.dict-pos{font-size:var(--fs-sm);color:var(--text3);margin-bottom:8px}
.dict-section{margin-top:12px}
.dict-section-title{font-size:12px;font-weight:600;color:var(--blue);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border2)}
.dict-meaning{padding:6px 0;border-bottom:1px solid var(--border2)}
.dict-meaning:last-child{border-bottom:none}
.dict-meaning .dm-num{display:inline-block;min-width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:var(--blue-bg);color:var(--blue);font-size:10px;font-weight:600;margin-right:6px}
.dict-meaning .dm-cn{font-weight:500;color:var(--text);margin-bottom:2px}
.dict-meaning .dm-exp{font-size:var(--fs-sm);color:var(--text3);margin-bottom:2px}
.dict-meaning .dm-ex{font-size:var(--fs-sm);color:var(--blue);margin-top:2px}
.dict-meaning .dm-ex-cn{font-size:var(--fs-xs);color:var(--text3)}
.dict-meaning .dm-reg{font-size:10px;color:var(--text3);background:var(--input);padding:1px 6px;border-radius:4px;margin-left:4px}
.dict-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.dict-tag{padding:2px 8px;border-radius:6px;font-size:10px;font-weight:500;background:var(--input);color:var(--text2)}
.dict-list{padding:0;margin:4px 0;list-style:none}
.dict-list li{padding:2px 0;font-size:var(--fs-sm);color:var(--text2);display:flex;align-items:flex-start;gap:4px}
.dict-list li::before{content:'•';color:var(--blue);flex-shrink:0}

/* Conjugation Tabs in translation result */
.conj-tabs{display:flex;gap:0;margin-top:12px;border-radius:var(--radius-sm);overflow:hidden;border:1.5px solid var(--border)}
.conj-tab{flex:1;text-align:center;padding:8px 0;font-size:var(--fs-sm);font-weight:500;color:var(--text3);background:var(--input);transition:all .2s;cursor:pointer;border:none;outline:none}
.conj-tab.active{background:var(--blue);color:#fff}
.conj-tab:active{opacity:.85}
.conj-panel{display:none;padding:12px;background:var(--surface);border:1.5px solid var(--border);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);animation:fadeIn .2s ease}
.conj-panel.active{display:block}
.conj-table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
.conj-table th,.conj-table td{padding:6px;border:1px solid var(--border2);text-align:center}
.conj-table th{background:var(--input);color:var(--blue);font-weight:600;font-size:11px}
.conj-table td{color:var(--text);font-weight:500}
.conj-table td.pronoun{color:var(--text3);font-weight:400;font-size:12px;text-align:right;width:55px}
.conj-label{font-size:11px;color:var(--text3);margin-bottom:6px}
.conj-label b{color:var(--blue)}
.conj-label-row{display:flex;gap:8px;margin-bottom:4px}
	.conj-section{margin-top:14px;padding-top:12px;border-top:1px solid var(--border2)}
	.conj-section:first-child{margin-top:8px;border-top:none}

/* Multi meanings */
.multi-meanings{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border2)}
.mm-title{font-size:11px;font-weight:600;color:var(--text3);margin-bottom:4px}
.mm-item{display:inline-block;padding:3px 8px;margin:2px 3px;border-radius:12px;background:var(--blue-bg);color:var(--blue);font-size:12px}

/* ═══ TRANSLATE (keep existing) ═══ */
.lang-bar{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;flex-shrink:0}
.lang-sel{position:relative}
.lang-sel-btn{padding:7px 16px;border-radius:20px;font-size:var(--fs-sm);font-weight:500;background:var(--surface);border:1.5px solid var(--border);color:var(--text2);transition:all .2s;min-width:72px;text-align:center}
.lang-popup{position:absolute;top:110%;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;display:none;z-index:10;min-width:100px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.lang-popup.show{display:block;animation:fadeIn .15s ease}
.lang-popup button{display:block;width:100%;padding:9px 14px;border-radius:7px;font-size:var(--fs-sm);color:var(--text2);text-align:center;transition:all .15s}
.lang-popup button:hover{background:var(--blue-bg);color:var(--blue)}
.lang-popup button.active{color:var(--blue)}
.swap-btn{font-size:18px;color:var(--text3);padding:6px 10px;border-radius:50%;transition:all .3s}
.swap-btn:active{transform:rotate(180deg);background:var(--blue-bg)}
.tr-input-wrap{position:relative;flex-shrink:0;margin-bottom:6px}
.tr-input-wrap textarea{padding:16px 44px 16px 16px;min-height:100px;font-size:16px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);line-height:1.5}
.tr-input-wrap textarea:focus{border-color:var(--blue)}
.clear-btn{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;color:var(--text3);font-size:11px;display:flex;align-items:center;justify-content:center}
.clear-btn:active{background:var(--blue);color:#fff}
.tr-mode-wrap{position:absolute;right:6px;bottom:6px;z-index:5}
.tr-mode-trigger{font-size:10px;padding:4px 8px;border-radius:12px;background:var(--surface);border:1px solid var(--border);color:var(--text3);display:flex;align-items:center;gap:3px}
.tr-mode-trigger.deep{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.tr-mode-popup{position:absolute;right:0;bottom:100%;margin-bottom:6px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;display:none;min-width:140px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.tr-mode-popup.show{display:block;animation:fadeIn .15s ease}
.tr-mode-popup button{display:block;width:100%;text-align:left;padding:9px 12px;border-radius:7px;font-size:var(--fs-sm);color:var(--text2);transition:all .15s}
.tr-mode-popup button:hover{background:var(--blue-bg);color:var(--blue)}
.tr-mode-popup button.active{color:var(--blue)}
.tr-mode-popup button .pop-label{font-size:10px;color:var(--text3);display:block}
.tr-options{display:flex;justify-content:space-between;align-items:center;margin:4px 0 10px;flex-shrink:0}
.auto-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text3)}
.toggle-track{width:34px;height:20px;border-radius:10px;background:var(--border);position:relative;cursor:pointer;transition:background .25s}
.toggle-track.on{background:var(--blue)}
.toggle-track::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .25s}
.toggle-track.on::after{transform:translateX(14px)}
.tr-actions{display:flex;gap:8px;flex-shrink:0;margin-bottom:10px;align-items:center}
.btn-translate{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:14px;font-weight:700;flex-shrink:0;box-shadow:0 4px 20px rgba(37,99,235,.25);display:flex;align-items:center;justify-content:center}
.btn-translate:active{transform:scale(.93)}
.btn-translate:disabled{opacity:.5;transform:none}
.btn-speak{flex:1;padding:12px;border-radius:var(--radius-sm);font-size:var(--fs-sm);font-weight:600;background:var(--surface);color:var(--text2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;gap:5px}
.btn-speak:active{background:var(--blue-bg);border-color:var(--blue)}
.btn-speak:disabled{opacity:.35}
.tr-result{margin:4px 0 10px;padding:16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);flex-shrink:0;animation:fadeIn .25s ease}
.tr-result .tr-source{font-size:var(--fs-sm);color:var(--text3);margin-bottom:4px}
.tr-result .tr-text{font-size:18px;color:var(--text);line-height:1.5;font-weight:500}
.tr-result .tr-phonetic{font-size:var(--fs-sm);color:var(--text2);margin-top:4px}
.tr-result .tr-save{margin-top:10px;display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:6px 14px;border-radius:20px;background:var(--input);border:1px solid var(--border);color:var(--text2)}
.tr-result .tr-save:active{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.tr-copy{margin-top:10px;display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:6px 14px;border-radius:20px;background:var(--input);border:1px solid var(--border);color:var(--text2);margin-left:6px}
.tr-copy:active{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.tr-copy.copied{background:rgba(34,197,94,.08);border-color:var(--green);color:var(--green)}
	.tr-analysis-btns{display:flex;gap:8px;margin-top:12px}
	.tr-analysis-btn{flex:1;padding:10px 0;border-radius:var(--radius-sm);font-size:13px;font-weight:600;background:var(--input);border:1.5px solid var(--border);color:var(--text2);transition:all .15s;text-align:center}
	.tr-analysis-btn:active{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.history-trigger{font-size:11px;color:var(--text3);cursor:pointer;padding:4px 8px;border-radius:6px;display:flex;align-items:center;gap:3px}
.history-trigger:hover{color:var(--text)}
.history-trigger .ht-count{background:var(--border);color:var(--text2);font-size:10px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px}
.history-popup{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;display:none;align-items:flex-end;justify-content:center}
.history-popup.show{display:flex}
.history-popup .hp-panel{width:100%;max-width:480px;max-height:60vh;background:var(--surface);border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:slideUp .3s ease}
.history-popup .hp-hdr{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.history-popup .hp-hdr .hp-title{font-weight:600;font-size:15px;color:var(--blue)}
.history-popup .hp-list{flex:1;overflow-y:auto;padding:6px 12px 12px}
.h-item{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;margin-bottom:4px;border:1px solid transparent}
.h-item:active{background:var(--input);border-color:var(--border)}
.h-item .h-icon{font-size:12px;color:var(--text3);flex-shrink:0}
.h-item .h-body{flex:1;min-width:0}
.h-item .h-src{font-size:var(--fs-xs);color:var(--text3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h-item .h-tgt{font-size:var(--fs-sm);color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.empty-state{text-align:center;padding:36px 12px;color:var(--text3);font-size:var(--fs-sm);line-height:1.8}

/* ═══ LEARN - Subject tabs ═══ */
.subj-tabs{display:flex;gap:6px;margin-bottom:10px;flex-shrink:0}
.subj-tab{flex:1;padding:10px 0;text-align:center;border-radius:var(--radius-sm);font-size:var(--fs-sm);font-weight:600;color:var(--text3);background:var(--surface);border:1.5px solid var(--border);transition:all .2s}
.subj-tab.active{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.subj-tab.disabled{opacity:.4}

/* Sub-tabs */
.sub-tabs{display:flex;gap:3px;margin-bottom:10px;flex-shrink:0;flex-wrap:wrap}
.sub-tab{padding:7px 13px;border-radius:18px;font-size:var(--fs-sm);font-weight:500;color:var(--text3);background:var(--surface);border:1px solid var(--border);transition:all .2s;white-space:nowrap}
.sub-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Lesson detail tabs */
.les-tabs{display:flex;gap:4px;margin:8px 0;flex-shrink:0}
.les-tab{flex:1;padding:7px 0;text-align:center;border-radius:6px;font-size:var(--fs-sm);font-weight:500;color:var(--text3);background:var(--input);transition:all .15s}
.les-tab.active{background:var(--blue-bg);color:var(--blue)}

/* Book selector */
.book-bar{display:flex;gap:4px;margin-bottom:8px;flex-shrink:0;overflow-x:auto}
.book-bar::-webkit-scrollbar{display:none}
.book-chip{flex-shrink:0;padding:6px 13px;border-radius:18px;font-size:var(--fs-sm);font-weight:500;color:var(--text3);background:var(--surface);border:1.5px solid var(--border);transition:all .2s}
.book-chip.active{border-color:var(--blue);color:var(--blue);background:var(--blue-bg)}
.search-box{margin-bottom:8px;flex-shrink:0;position:relative}
.search-box input{padding:9px 14px 9px 34px;font-size:var(--fs-sm);background:var(--surface)}
.search-box .sicon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px}
.les-scroll{flex:1;overflow-y:auto;min-height:0}
.les-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:6px;overflow:hidden}
.les-card-hdr{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;cursor:pointer}
.les-card-hdr:active{background:var(--input)}
.les-card-hdr .les-num{font-weight:600;color:var(--blue);font-size:var(--fs-sm)}
.les-card-hdr .les-title{font-size:var(--fs-sm);color:var(--text2);margin-top:1px}
.les-card-hdr .les-arrow{font-size:11px;color:var(--text3);transition:transform .25s}
.les-card.open .les-card-hdr .les-arrow{transform:rotate(180deg)}
.les-card-body{display:none;padding:0 10px 10px}
.les-card.open .les-card-body{display:block}
.vocab-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:0}
.vg-ru{padding:5px 4px;font-weight:500;color:var(--blue);font-size:var(--fs-sm);border-bottom:1px solid var(--border2);display:flex;align-items:center;gap:4px}
.vg-cn{padding:5px 4px;color:var(--text);font-size:var(--fs-sm);border-bottom:1px solid var(--border2)}
.vg-act{padding:5px 2px;font-size:12px;color:var(--text3);cursor:pointer}
.vg-act:active{color:var(--blue)}
.vg-act.saved{color:var(--blue)}
.grid-hdr{padding:5px 4px;font-size:var(--fs-xs);color:var(--text3);font-weight:600;border-bottom:2px solid var(--border)}
.grammar-mini{padding:8px 4px;font-size:var(--fs-sm);color:var(--text2);line-height:1.8}
.grammar-mini b{color:var(--text)}
.grammar-mini .ex{color:var(--blue);font-weight:500}
.grammar-mini table{width:100%;border-collapse:collapse;margin:6px 0;font-size:var(--fs-xs)}
.grammar-mini td,.grammar-mini th{padding:4px 6px;border:1px solid var(--border);text-align:center}
.grammar-mini th{background:var(--input);color:var(--blue)}

/* Quiz mini */
.quiz-mini{padding:6px 4px}
.quiz-mini .qm-q{font-weight:500;margin-bottom:8px;font-size:var(--fs-sm)}
.quiz-mini .qm-opt{display:block;width:100%;text-align:left;padding:10px 12px;margin-bottom:4px;border-radius:var(--radius-sm);background:var(--input);border:1.5px solid var(--border);font-size:var(--fs-sm);color:var(--text);transition:all .15s}
.quiz-mini .qm-opt:active{transform:scale(.98)}
.quiz-mini .qm-opt.correct{border-color:var(--green);background:rgba(34,197,94,.08);color:var(--green)}
.quiz-mini .qm-opt.wrong{border-color:var(--red);background:rgba(239,68,68,.08);color:var(--red)}
.quiz-mini .qm-result{margin-top:8px;font-size:var(--fs-sm);font-weight:500;display:none}

/* CEFR tests */
.level-desc{padding:8px 12px;font-size:var(--fs-sm);color:var(--text2);line-height:1.8;margin-bottom:10px}
.level-desc strong{color:var(--text)}
.level-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px}
.level-card .lc-title{font-weight:600;font-size:15px;margin-bottom:4px;color:var(--text)}
.level-card .lc-sub{font-size:var(--fs-sm);color:var(--text3);margin-bottom:8px}
.level-card .lc-btn{padding:8px 18px;border-radius:18px;background:var(--blue);color:#fff;font-size:var(--fs-sm);font-weight:500;display:inline-block}
.level-card .lc-btn:active{opacity:.8}

/* Favorites & Settings (simple) */
.fav-stats{font-size:var(--fs-sm);color:var(--text3);padding:4px 2px 8px}
.fav-stats strong{color:var(--blue)}
.fav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;background:var(--surface);margin-bottom:4px;border:1px solid var(--border)}
.fav-item:active{background:var(--input)}
.fav-item .fv-ru{font-weight:500;color:var(--blue);font-size:var(--fs-sm);min-width:80px}
.fav-item .fv-cn{color:var(--text2);font-size:var(--fs-sm);flex:1}
.fav-item .fv-act{font-size:14px;color:var(--text3);padding:4px}
.fav-item .fv-act:active{color:var(--blue)}
.setting-group{margin-bottom:16px}
.setting-group-title{font-size:var(--fs-sm);color:var(--blue);font-weight:600;margin-bottom:8px}
.setting-card{background:var(--surface);border-radius:var(--radius-sm);padding:14px;margin-bottom:6px;border:1px solid var(--border)}
.setting-card .s-label{font-size:14px;font-weight:500;color:var(--text);margin-bottom:3px}
.setting-card .s-desc{font-size:var(--fs-sm);color:var(--text3);margin-bottom:8px}
.setting-card .s-row{display:flex;justify-content:space-between;align-items:center}
.spd-grid{display:flex;flex-wrap:wrap;gap:4px}
.spd-chip{padding:5px 12px;border-radius:6px;font-size:12px;color:var(--text3);background:var(--input);border:1px solid var(--border)}
.spd-chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
input[type="range"]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:var(--border);outline:none;border:none;padding:0}
input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--blue);cursor:pointer}

/* Animations */
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.anim-in{animation:fadeIn .25s ease}
.lds{display:flex;gap:5px;justify-content:center;align-items:center;padding:20px}
.lds span{width:7px;height:7px;border-radius:50%;background:var(--text3);animation:ld 1.2s infinite}
.lds span:nth-child(2){animation-delay:.15s}
.lds span:nth-child(3){animation-delay:.3s}
@keyframes ld{0%,80%,100%{opacity:.3;transform:scale(.7)}40%{opacity:1;transform:scale(1);background:var(--blue)}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--blue);border:1px solid var(--border);padding:10px 22px;border-radius:20px;font-size:var(--fs-sm);z-index:999;opacity:0;transition:opacity .3s,bottom .3s;pointer-events:none;white-space:nowrap;max-width:80vw}
.toast.show{opacity:1;bottom:94px}
@media(min-width:481px){.app{border-left:1px solid var(--border);border-right:1px solid var(--border)}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header"><h1>俄语学习 v6</h1><button class="btn-dict" id="btnOpenDict">📖 字典</button></header>
  <div class="content" id="content">

    <!-- ══ TRANSLATE ══ -->
    <div class="screen active" id="sTranslate">
      <div class="lang-bar">
        <div class="lang-sel" id="srcSel">
          <button class="lang-sel-btn" id="srcLangBtn">俄语</button>
          <div class="lang-popup" id="srcPopup">
            <button data-lang="ru" class="active">Русский</button>
            <button data-lang="en">English</button>
            <button data-lang="zh-CN">中文</button>
          </div>
        </div>
        <button class="swap-btn" id="swapLang">⇄</button>
        <div class="lang-sel" id="tgtSel">
          <button class="lang-sel-btn" id="tgtLangBtn">中文</button>
          <div class="lang-popup" id="tgtPopup">
            <button data-lang="zh-CN" class="active">中文</button>
            <button data-lang="en">English</button>
            <button data-lang="ru">Русский</button>
          </div>
        </div>
      </div>
      <div class="tr-input-wrap">
        <textarea id="trInput" placeholder="输入文本..." rows="2" autocomplete="off"></textarea>
        <div class="tr-mode-wrap">
          <button class="tr-mode-trigger" id="modeTrigger">⚡ 快速</button>
          <div class="tr-mode-popup" id="modePopup">
            <button data-mode="fast" class="active"><span>⚡ 快速</span><span class="pop-label">免费引擎</span></button>
            <button data-mode="deep"><span>🧠 深度</span><span class="pop-label">DeepSeek</span></button>
          </div>
        </div>
        <button class="clear-btn" id="clearInput">✕</button>
      </div>
      <div class="tr-options">
        <label class="auto-toggle"><span class="toggle-track on" id="autoToggle"></span><span>自动翻译</span></label>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:11px;color:var(--text3)" id="charCount">0</span>
          <span class="history-trigger" id="historyTrigger">📄 记录<span class="ht-count" id="htCount">0</span></span>
        </div>
      </div>
      <div class="tr-actions">
        <button class="btn-translate" id="btnTranslate">&#9654;</button>
        <button class="btn-speak" id="btnSpeak" disabled>🔊 朗读</button>
      </div>
      <div id="trResult"></div>
    </div>

    <!-- ══ DICTIONARY ══ -->
    <div class="screen" id="sDict">
      <div class="dict-header">
        <button class="dict-back" id="btnBackTranslate">←</button>
        <span class="dict-title">📖 字典</span>
      </div>
      <div class="dict-input-wrap">
        <input type="text" id="dictInput" placeholder="输入俄语单词..." autocomplete="off">
        <button class="dict-search-btn" id="btnDictSearch">🔍</button>
      </div>
      <div class="dict-result" id="dictResult">
        <div class="empty-state">输入俄语单词，查看高质量词典释义</div>
      </div>
    </div>

    <!-- ══ LEARN ══ -->
    <div class="screen" id="sLearn">
      <div class="subj-tabs" id="subjTabs">
        <button class="subj-tab active" data-subj="ru">🇷🇺 俄语</button>
        <button class="subj-tab disabled" data-subj="en">🇬🇧 英语 (即将开放)</button>
      </div>
      <div class="sub-tabs" id="learnTabs">
        <button class="sub-tab active" data-tab="book">课本</button>
        <button class="sub-tab" data-tab="major">专业俄语</button>
        <button class="sub-tab" data-tab="cefr">等级考试</button>
        <button class="sub-tab" data-tab="settings">设置</button>
      </div>
      <div id="learnContent" style="flex:1;overflow-y:auto;min-height:0"></div>
    </div>

    <!-- ══ QUIZ ══ -->
    <div class="screen" id="sQuiz"><div id="quizArea"></div></div>

    <!-- ══ CLASS MODE (课堂语音翻译) ══ -->
    <div class="screen" id="sClass">
      <div style="padding:10px 0;flex-shrink:0">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <span style="font-weight:600;font-size:15px;color:var(--blue)">🎤 课堂模式</span>
          <span id="classStatus" style="font-size:11px;color:var(--text3)">未开始</span>
          <span style="flex:1"></span>
          <span style="font-size:11px;color:var(--text3)" id="classCount">0 句</span>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <button id="classStartBtn" style="flex:1;padding:13px 0;border-radius:var(--radius-sm);font-size:14px;font-weight:700;background:var(--blue);color:#fff">🎙️ 开始录音</button>
          <button id="classStopBtn" style="flex:1;padding:13px 0;border-radius:var(--radius-sm);font-size:14px;font-weight:700;background:var(--input);color:var(--text2);border:1.5px solid var(--border)" disabled>⏹ 停止</button>
        </div>
        <div style="font-size:11px;color:var(--text3);line-height:1.6;margin-bottom:6px" id="classHint">
          说俄语 → 自动转文字 → 翻译显示。识别引擎：<b id="classEngine">Web Speech API</b>（Whisper 接入后自动升级）
        </div>
      </div>
      <div id="classBoard" style="flex:1;overflow-y:auto;min-height:0;padding-bottom:10px">
        <div class="empty-state" id="classEmpty">点击"开始录音"，老师说一句就显示一句<br>原文（大）＋ 译文（小），自动滚动</div>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0;padding-bottom:8px">
        <button id="classSaveBtn" style="flex:1;padding:9px 0;border-radius:var(--radius-sm);font-size:12px;background:var(--surface);color:var(--text2);border:1.5px solid var(--border)">💾 保存本课记录</button>
        <button id="classClearBtn" style="flex:1;padding:9px 0;border-radius:var(--radius-sm);font-size:12px;background:var(--surface);color:var(--text2);border:1.5px solid var(--border)">🧹 清空</button>
      </div>
    </div>

    <!-- ══ MORE ══ -->
    <div class="screen" id="sMore">
      <div class="sub-tabs" style="margin-bottom:10px">
        <button class="sub-tab active" data-more="fav">收藏</button>
        <button class="sub-tab" data-more="app-settings">设置</button>
      </div>
      <div id="subFav" style="flex:1;overflow-y:auto">
        <div class="fav-stats" id="favStats">已收藏 <strong>0</strong> 个单词</div>
        <div id="favList"><div class="empty-state">还没有收藏的单词</div></div>
      </div>
      <div id="subAppSettings" style="display:none;flex:1;overflow-y:auto"><div id="appSettingsContent"></div></div>
    </div>
  </div>

  <nav class="nav" id="nav">
    <button class="nav-btn active" data-screen="sTranslate"><span class="icon">🌐</span><span>翻译</span></button>
    <button class="nav-btn" data-screen="sLearn"><span class="icon">📚</span><span>学习</span></button>
    <button class="nav-btn" data-screen="sQuiz"><span class="icon">🎯</span><span>测验</span></button>
    <button class="nav-btn" data-screen="sClass"><span class="icon">🎤</span><span>课堂</span></button>
    <button class="nav-btn" data-screen="sMore"><span class="icon">📦</span><span>更多</span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<div class="history-popup" id="historyPopup">
  <div class="hp-panel">
    <div class="hp-hdr"><span class="hp-title">翻译记录</span><div style="display:flex;align-items:center;gap:8px"><button id="popupClearHistory" style="font-size:12px;color:var(--text2)">清空</button><button class="hp-close" id="popupClose">✕</button></div></div>
    <div class="hp-list" id="popupHistoryList"><div class="empty-state">暂无记录</div></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  TRANSLATION ENGINE (unchanged core)
// ═══════════════════════════════════════════════════════════════
const LANGS={ru:'俄语',en:'英语','zh-CN':'中文'};
const LANG_TO_API={ru:'ru',en:'en','zh-CN':'zh-CN'};
const CFG={models:[{id:'mymemory',name:'MyMemory',desc:'神经网络翻译引擎，免费不限次',api:'https://api.mymemory.translated.net/get'},{id:'libre',name:'LibreTranslate',desc:'开源翻译引擎，俄语翻译优秀',api:'https://translate.terraprint.co/translate'}],speeds:[0.25,0.5,0.75,1,1.25,1.5,1.75,2],fsRange:[13,24]};
function ls(k,d){try{return JSON.parse(localStorage.getItem('ru_'+k))||d}catch{return d}}
function ss(k,v){localStorage.setItem('ru_'+k,JSON.stringify(v))}
const S={settings:ls('settings',{model:'mymemory',speed:.75,fontSize:16,autoTr:true,mode:'fast',dsKey:''}),history:ls('history',[]),favs:ls('favs',[]),isSpeaking:false,result:null,langSrc:'ru',langTgt:'zh-CN'};
function save(k){ss(k,S[k])}

let _tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2200)}

// ═══ SCREEN SWITCHING ═══
function showTranslate(){hideDict();document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('sTranslate').classList.add('active');document.querySelector('.nav-btn[data-screen=sTranslate]').classList.add('active');document.getElementById('content').scrollTop=0;updateDictBtnVisibility()}
function showDict(){document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('sDict').classList.add('active');document.getElementById('content').scrollTop=0;updateDictBtnVisibility()}
function hideDict(){updateDictBtnVisibility()}
function updateDictBtnVisibility(){const inDict=document.getElementById('sDict').classList.contains('active');document.getElementById('btnOpenDict').style.display=inDict?'none':''}

// Nav
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.screen).classList.add('active');document.getElementById('content').scrollTop=0;updateDictBtnVisibility()}));

// Dict ↔ Translate
document.getElementById('btnOpenDict').addEventListener('click',showDict);
document.getElementById('btnBackTranslate').addEventListener('click',showTranslate);

// Lang selectors
function updateLangUI(){document.getElementById('srcLangBtn').textContent=LANGS[S.langSrc];document.getElementById('tgtLangBtn').textContent=LANGS[S.langTgt];document.querySelectorAll('#srcPopup button').forEach(b=>b.classList.toggle('active',b.dataset.lang===S.langSrc));document.querySelectorAll('#tgtPopup button').forEach(b=>b.classList.toggle('active',b.dataset.lang===S.langTgt))}
document.getElementById('srcLangBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('srcPopup').classList.toggle('show');document.getElementById('tgtPopup').classList.remove('show')});
document.querySelectorAll('#srcPopup button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();S.langSrc=b.dataset.lang;if(S.langSrc===S.langTgt)S.langTgt=S.langSrc==='zh-CN'?'ru':'zh-CN';updateLangUI();document.getElementById('srcPopup').classList.remove('show');if(document.getElementById('trInput').value.trim())doTranslate()}));
document.getElementById('tgtLangBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('tgtPopup').classList.toggle('show');document.getElementById('srcPopup').classList.remove('show')});
document.querySelectorAll('#tgtPopup button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();S.langTgt=b.dataset.lang;if(S.langSrc===S.langTgt)S.langSrc=S.langTgt==='zh-CN'?'ru':'zh-CN';updateLangUI();document.getElementById('tgtPopup').classList.remove('show');if(document.getElementById('trInput').value.trim())doTranslate()}));
document.getElementById('swapLang').addEventListener('click',()=>{const t=document.getElementById('trInput').value.trim();if(t){const d=detectLang(t);if(d==='ru'||d==='en'||d==='zh-CN'){const all=['ru','en','zh-CN'];S.langSrc=d;S.langTgt=all.find(l=>l!==d&&l!==S.langTgt)||(d==='zh-CN'?'en':'zh-CN')}else{[S.langSrc,S.langTgt]=[S.langTgt,S.langSrc]}}else{[S.langSrc,S.langTgt]=[S.langTgt,S.langSrc]}updateLangUI();if(t)doTranslate()});
document.addEventListener('click',()=>{document.getElementById('srcPopup').classList.remove('show');document.getElementById('tgtPopup').classList.remove('show')});
function detectLang(t){if(/[а-яА-ЯёЁ]/.test(t))return'ru';if(/[一-鿿]/.test(t))return'zh-CN';return'en'}
function autoSrcLang(t){const d=detectLang(t);if(S.langSrc!==d&&(d==='ru'||d==='en'||d==='zh-CN')){S.langSrc=d;updateLangUI()}}

function applyFont(v){const r=document.documentElement;r.style.setProperty('--fs',v+'px');r.style.setProperty('--fs-sm',Math.max(11,v-3)+'px');r.style.setProperty('--fs-xs',Math.max(9,v-5)+'px');S.settings.fontSize=v;save('settings')}

// Translate
// Translate (with fallback: if configured engine fails, try MyMemory)
async function translateFree(txt,mid){
  if(!txt.trim())return null;
  const src=LANG_TO_API[S.langSrc],tgt=LANG_TO_API[S.langTgt];
  const tryLibre=async()=>{const lz={ru:'ru',en:'en','zh-CN':'zh'};const r=await fetch(CFG.models[1].api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:txt,source:lz[src],target:lz[tgt],format:'text'}),signal:AbortSignal.timeout(8000)});const d=await r.json();if(d.translatedText)return{text:d.translatedText,det:'LibreTranslate'};throw new Error(d.error||'失败')};
  const tryMyMemory=async()=>{const r=await fetch(`${CFG.models[0].api}?q=${encodeURIComponent(txt)}&langpair=${src}|${tgt}`,{signal:AbortSignal.timeout(8000)});const d=await r.json();if(d.responseStatus===200&&d.responseData)return{text:d.responseData.translatedText,det:'MyMemory'};throw new Error(d.responseDetails||'失败')};
  if(mid==='mymemory'){
    try{return await tryMyMemory()}catch(e){try{return await tryLibre()}catch(e2){throw new Error(e.message||'失败')}}
  }else{
    try{return await tryLibre()}catch(e){try{return await tryMyMemory()}catch(e2){throw new Error(e.message||'失败')}}
  }
}
async function translateDeepSeek(txt){if(!txt.trim())return null;const resp=await fetch('http://localhost:8765/api/translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:S.settings.dsKey,src:S.langSrc,tgt:S.langTgt,text:txt}),signal:AbortSignal.timeout(20000)});if(!resp.ok){const e=await resp.json().catch(()=>({error:'失败'}));throw new Error(e.error||'代理错误')}const d=await resp.json();if(d.error)throw new Error(d.error);return{text:d.text,det:'DeepSeek'}}
function escape(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}

function speak(t,lang,rate){if(!window.speechSynthesis||S.isSpeaking)return;S.isSpeaking=true;const u=new SpeechSynthesisUtterance(t);const m={ru:'ru-RU',en:'en-US','zh-CN':'zh-CN'};u.lang=m[lang]||'zh-CN';u.rate=rate||S.settings.speed;const v=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith(u.lang.split('-')[0]));if(v)u.voice=v;u.onend=()=>S.isSpeaking=false;u.onerror=()=>S.isSpeaking=false;window.speechSynthesis.speak(u)}

const $trInput=document.getElementById('trInput'),$trResult=document.getElementById('trResult'),$btnTr=document.getElementById('btnTranslate'),$btnSpeak=document.getElementById('btnSpeak');

// ═══ Check if text is a single Russian word ═══
function isSingleRussianWord(txt){return !!cleanRussianWord(txt)}
// 清洗标点后取俄语单词（"читать。" → "читать"，多词/非俄语 → null）
function cleanRussianWord(txt){
  if(!txt)return null;
  const t=txt.trim().replace(/[.,;:!?…"«»()\-—'’‘。！？，、；：]/g,'').trim();
  if(t.indexOf(' ')>-1)return null;
  return /^[а-яА-ЯёЁ]+$/i.test(t)?t:null;
}

// ═══ Fetch word analysis (aspect + time conjugation + multi meanings) ═══
async function fetchWordAnalysis(word){
  try{
    const resp=await fetch('http://localhost:8765/api/word-analysis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:S.settings.dsKey,word:word}),signal:AbortSignal.timeout(60000)});
    if(!resp.ok){const e=await resp.json().catch(()=>({error:'HTTP '+resp.status}));throw new Error(e.error||'代理错误')}
    const d=await resp.json();
    if(d.error){throw new Error(d.error+(d.snippet?' | 模型返回: '+d.snippet:''))}
    return d;
  }catch(e){return {_error:e.message}}
}

// ═══ Render Aspect Panel (完成体/未完成体) ═══
function renderAspectPanel(analysis){
  if(!analysis)return'';
  const a=analysis.aspect;
  let html='<div class="conj-section"><div class="dict-section-title">🔄 完成体 / 未完成体</div>';
  if(!a){
    html+='<div style="color:var(--text3);font-size:13px;padding:4px 0">该词不是动词，没有体的变化</div></div>';
    return html;
  }

  if(a.imperfective){
    const imp=a.imperfective;
    html+='<div class="conj-label"><b>未完成体 (НСВ)</b> — 过程、重复、持续'+(imp.infinitive?'<br>不定式: <b style="color:var(--blue)">'+escape(imp.infinitive)+'</b>':'')+'</div>';
    html+='<table class="conj-table">';
    if(imp.past)html+=`<tr><td class="pronoun">过去时</td><td>${imp.past.masc||'—'} / ${imp.past.fem||'—'} / ${imp.past.neut||'—'} / ${imp.past.plur||'—'}</td></tr>`;
    if(imp.present)html+=`<tr><td class="pronoun">现在时</td><td>${imp.present['я']||'—'} / ${imp.present['ты']||'—'} / ${imp.present['он']||'—'} / ${imp.present['мы']||'—'} / ${imp.present['вы']||'—'} / ${imp.present['они']||'—'}</td></tr>`;
    if(imp.future)html+=`<tr><td class="pronoun">将来时</td><td>${imp.future['я']||'—'} / ${imp.future['ты']||'—'} / ${imp.future['он']||'—'} / ${imp.future['мы']||'—'} / ${imp.future['вы']||'—'} / ${imp.future['они']||'—'}</td></tr>`;
    if(imp.imperative)html+=`<tr><td class="pronoun">命令式</td><td>${imp.imperative.sg||'—'} / ${imp.imperative.pl||'—'}</td></tr>`;
    if(!imp.past&&!imp.present&&!imp.future)html+='<tr><td colspan="2" style="color:var(--text3)">未提供变位数据</td></tr>';
    html+='</table>';
  }

  if(a.perfective){
    const perf=a.perfective;
    html+='<div class="conj-label" style="margin-top:12px"><b>完成体 (СВ)</b> — 结果、一次、完成'+(perf.infinitive?'<br>不定式: <b style="color:var(--blue)">'+escape(perf.infinitive)+'</b>':'')+'</div>';
    html+='<table class="conj-table">';
    if(perf.past)html+=`<tr><td class="pronoun">过去时</td><td>${perf.past.masc||'—'} / ${perf.past.fem||'—'} / ${perf.past.neut||'—'} / ${perf.past.plur||'—'}</td></tr>`;
    html+='<tr><td class="pronoun">现在时</td><td style="color:var(--text3)">❌ 完成体没有现在时</td></tr>';
    if(perf.future)html+=`<tr><td class="pronoun">将来时</td><td>${perf.future['я']||'—'} / ${perf.future['ты']||'—'} / ${perf.future['он']||'—'} / ${perf.future['мы']||'—'} / ${perf.future['вы']||'—'} / ${perf.future['они']||'—'}</td></tr>`;
    if(perf.imperative)html+=`<tr><td class="pronoun">命令式</td><td>${perf.imperative.sg||'—'} / ${perf.imperative.pl||'—'}</td></tr>`;
    if(!perf.past&&!perf.future)html+='<tr><td colspan="2" style="color:var(--text3)">未提供变位数据</td></tr>';
    html+='</table>';
  }

  if(!a.imperfective&&!a.perfective){
    html+='<div style="color:var(--text3);font-size:13px;padding:4px 0">该词不是动词，没有体的变化</div>';
  }

  html+='</div>';
  return html;
}

// ═══ Render Tense Panel (时态变位) ═══
function renderTensePanel(analysis){
  if(!analysis)return'';
  const a=analysis.aspect;
  let html='<div class="conj-section"><div class="dict-section-title">⏳ 时态变位</div>';
  if(!a||!a.imperfective){
    html+='<div style="color:var(--text3);font-size:13px;padding:4px 0">该词不是动词，没有时态变化</div></div>';
    return html;
  }
  const imp=a.imperfective;
  const perf=a.perfective;

  // Past tense (by gender/number)
  if(imp.past){
    html+='<div class="conj-label"><b>过去时</b>（按性数变化，不分人称）</div>';
    html+='<table class="conj-table"><tr><th>阳性 (он)</th><th>阴性 (она)</th><th>中性 (оно)</th><th>复数 (они)</th></tr>';
    html+=`<tr><td>${imp.past.masc||'—'}</td><td>${imp.past.fem||'—'}</td><td>${imp.past.neut||'—'}</td><td>${imp.past.plur||'—'}</td></tr></table>`;
  }

  // Present tense (only imperfective has present)
  if(imp.present){
    html+='<div class="conj-label" style="margin-top:10px"><b>现在时</b>（仅未完成体有现在时）</div>';
    html+='<table class="conj-table"><tr><th>я</th><th>ты</th><th>он/она/оно</th><th>мы</th><th>вы</th><th>они</th></tr>';
    html+=`<tr><td>${imp.present['я']||'—'}</td><td>${imp.present['ты']||'—'}</td><td>${imp.present['он']||'—'}</td><td>${imp.present['мы']||'—'}</td><td>${imp.present['вы']||'—'}</td><td>${imp.present['они']||'—'}</td></tr></table>`;
  }

  // Future tense — imperfective (быть + infinitive)
  if(imp.future){
    html+='<div class="conj-label" style="margin-top:10px"><b>将来时 — 未完成体</b></div>';
    html+='<div style="font-size:11px;color:var(--text3);margin-bottom:4px">быть + 不定式（复合将来时）</div>';
    html+='<table class="conj-table"><tr><th>я</th><th>ты</th><th>он/она/оно</th><th>мы</th><th>вы</th><th>они</th></tr>';
    html+=`<tr><td>${imp.future['я']||'—'}</td><td>${imp.future['ты']||'—'}</td><td>${imp.future['он']||'—'}</td><td>${imp.future['мы']||'—'}</td><td>${imp.future['вы']||'—'}</td><td>${imp.future['они']||'—'}</td></tr></table>`;
  }

  // Future tense — perfective
  if(perf&&perf.future){
    html+='<div class="conj-label" style="margin-top:10px"><b>将来时 — 完成体</b></div>';
    html+='<div style="font-size:11px;color:var(--text3);margin-bottom:4px">完成体本身变位即表将来（简单将来时）</div>';
    const pf=perf.future;
    html+='<table class="conj-table"><tr><th>я</th><th>ты</th><th>он/она/оно</th><th>мы</th><th>вы</th><th>они</th></tr>';
    html+=`<tr><td>${pf['я']||'—'}</td><td>${pf['ты']||'—'}</td><td>${pf['он']||'—'}</td><td>${pf['мы']||'—'}</td><td>${pf['вы']||'—'}</td><td>${pf['они']||'—'}</td></tr></table>`;
  }

  if(!imp.past&&!imp.present&&!imp.future){
    html+='<div style="color:var(--text3);font-size:13px;padding:4px 0">未提供时态数据</div>';
  }

  html+='</div>';
  return html;
}

// ═══ Render Declension Panel (变格) ═══
function renderDeclensionPanel(analysis){
  if(!analysis||!analysis.declension)return'';
  const d=analysis.declension;
  const CASES=['nominative','genitive','dative','accusative','instrumental','prepositional'];
  const CN={nominative:'主格 (Им.)',genitive:'属格 (Род.)',dative:'与格 (Дат.)',accusative:'宾格 (Вин.)',instrumental:'工具格 (Твор.)',prepositional:'前置格 (Предл.)'};
  const hasData=CASES.some(c=>d[c]&&(d[c].sg||d[c].pl));
  if(!hasData)return'';
  let html='<div class="conj-section"><div class="dict-section-title">📐 变格</div>';
  html+='<table class="conj-table"><tr><th></th><th>单数</th><th>复数</th></tr>';
  CASES.forEach(c=>{
    if(d[c]&&(d[c].sg||d[c].pl)){
      html+=`<tr><td class="pronoun">${CN[c]}</td><td>${escape(d[c].sg||'—')}</td><td>${escape(d[c].pl||'—')}</td></tr>`;
    }
  });
  html+='</table></div>';
  return html;
}

// ═══ Render multi meanings ═══
function renderMultiMeanings(analysis){
  if(!analysis||!analysis.meanings||!analysis.meanings.length)return'';
  let html='<div class="multi-meanings"><div class="mm-title">📖 一词多译</div>';
  analysis.meanings.forEach(m=>{
    html+=`<span class="mm-item">${m.index}. ${escape(m.chinese)}</span>`;
  });
  html+='</div>';
  return html;
}

async function doTranslate(){
  const t=$trInput.value.trim();

  if(S.settings.mode==='deep'&&!S.settings.dsKey){
    const k=prompt('请输入 DeepSeek API Key（免费获取: platform.deepseek.com）');
    if(!k||!k.trim()){toast('需要 API Key 才能使用深度翻译');return}

  }
  autoSrcLang(t);
  $trResult.innerHTML='<div class="lds"><span></span><span></span><span></span></div>';
  $btnTr.disabled=true;
  try{
    const r=S.settings.mode==='deep'?await translateDeepSeek(t):await translateFree(t,S.settings.model);

  }finally{$btnTr.disabled=false}
}

function renderResult(r,src){
  const isFav=S.favs.some(f=>f.ru===src||f.cn===src||f.en===src);
  // Show analysis when either source or target is a single Russian word（容忍标点：如"читать。"）
  const ruWord=(S.langSrc==='ru'&&cleanRussianWord(src))||(S.langTgt==='ru'&&cleanRussianWord(r.text))||null;
  const showAnalysis=!!ruWord;
  $trResult.innerHTML=`<div class="tr-result"><div class="tr-source">${LANGS[S.langSrc]}: ${escape(src)}</div><div class="tr-text">${escape(r.text)}</div>${r.det?`<div class="tr-phonetic">${r.det}</div>`:''}<button class="tr-save" id="saveWordBtn">${isFav?'★ 已收藏':'☆ 收藏'}</button><button class="tr-copy" id="copyBtn">📋 复制</button>${showAnalysis?`<div class="tr-analysis-btns"><button class="tr-analysis-btn" id="btnAspect">🔄 完成体 / 未完成体</button><button class="tr-analysis-btn" id="btnTense">⏳ 时态变位</button></div><div id="analysisPanels"></div>`:''}</div>`;
  document.getElementById('saveWordBtn').addEventListener('click',()=>{toggleFav(src,r.text)});
  document.getElementById('copyBtn').addEventListener('click',()=>{navigator.clipboard.writeText(r.text).then(()=>{const b=document.getElementById('copyBtn');b.textContent='✓ 已复制';b.classList.add('copied');setTimeout(()=>{b.textContent='📋 复制';b.classList.remove('copied')},1500)}).catch(()=>toast('复制失败'))});
  // Analysis buttons — use ruWord (the Russian word to analyze)
  if(showAnalysis){
    const word=ruWord;
    let _a=null;
    const ensure=async()=>{
      if(_a)return _a;
      if(!S.settings.dsKey){const k=prompt('查看变位需要 DeepSeek API Key（免费获取: platform.deepseek.com）\n\n输入后自动保存：');if(!k||!k.trim())return null;S.settings.dsKey=k.trim();save('settings');renderAppSettings()}
      document.getElementById('analysisPanels').innerHTML='<div class="lds"><span></span><span></span><span></span></div>';
      _a=await fetchWordAnalysis(word);
      if(_a._error){document.getElementById('analysisPanels').innerHTML='<div style="color:var(--red);font-size:13px;padding:8px">❌ '+escape(_a._error)+'</div>';return null}
      if(!_a||!_a.aspect){document.getElementById('analysisPanels').innerHTML='<div style="color:var(--text3);font-size:13px;padding:8px">该词暂无变位数据</div>';return null}
      return _a;
    };
    document.getElementById('btnAspect').addEventListener('click',async()=>{
      document.getElementById('btnAspect').style.background='var(--blue-bg)';document.getElementById('btnTense').style.background='';
      const a=await ensure();if(!a)return;
      const tag=a._model?`<div style="font-size:11px;color:var(--text3);margin:8px 0 2px;text-align:right">🤖 ${escape(a._model)}</div>`:'';
      document.getElementById('analysisPanels').innerHTML=tag+(a.meanings?renderMultiMeanings(a):'')+renderAspectPanel(a)+renderDeclensionPanel(a);
    });
    document.getElementById('btnTense').addEventListener('click',async()=>{
      document.getElementById('btnTense').style.background='var(--blue-bg)';document.getElementById('btnAspect').style.background='';
      const a=await ensure();if(!a)return;
      const tag=a._model?`<div style="font-size:11px;color:var(--text3);margin:8px 0 2px;text-align:right">🤖 ${escape(a._model)}</div>`:'';
      document.getElementById('analysisPanels').innerHTML=tag+(a.meanings?renderMultiMeanings(a):'')+renderTensePanel(a)+renderDeclensionPanel(a);
    });
  }
}

const $dictInput=document.getElementById('dictInput'),$dictResult=document.getElementById('dictResult');

async function doDictSearch(){
  const word=$dictInput.value.trim();
  if(!word){toast('请输入单词');return}
  if(S.settings.mode==='deep'&&!S.settings.dsKey){
    const k=prompt('请输入 DeepSeek API Key');
    if(!k||!k.trim()){toast('需要 API Key');return}
    S.settings.dsKey=k.trim();save('settings')
  }
  $dictResult.innerHTML='<div class="lds"><span></span><span></span><span></span></div>';
  try{
    // Use deep mode dictionary API
    const resp=await fetch('http://localhost:8765/api/dictionary',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:S.settings.dsKey,word:word}),signal:AbortSignal.timeout(60000)});
    if(!resp.ok){const e=await resp.json().catch(()=>({error:'失败'}));throw new Error(e.error||'代理错误')}
    const d=await resp.json();
    if(d.error){throw new Error(d.error+(d.snippet?' | 模型返回: '+d.snippet:''))}
    renderDictResult(d);
  }catch(e){
    $dictResult.innerHTML=`<div class="dict-card"><div class="tr-text" style="color:var(--text3)">查询失败: ${e.message}</div></div>`;
    toast('字典查询失败')
  }
}

function renderDictResult(d){
  if(d.raw){
    // JSON parse failed, show raw
    $dictResult.innerHTML=`<div class="dict-card"><div class="dict-word">${escape(d.raw.split('\n')[0]||'')}</div><div class="grammar-mini">${escape(d.raw)}</div></div>`;
    return;
  }
  let html='<div class="dict-card">';
  html+=`<div class="dict-word">${escape(d.word||'')}<span class="stress">${escape(d.stress||'')}</span></div>`;
  html+=`<div class="dict-pos">${escape(d.pos||'')}${d.gender?' · '+escape(d.gender)+'性':''}${d.animacy?' · '+escape(d.animacy):''}</div>`;

  // Meanings
  if(d.meanings&&d.meanings.length){
    html+='<div class="dict-section"><div class="dict-section-title">释义</div>';
    d.meanings.forEach(m=>{
      html+=`<div class="dict-meaning"><span class="dm-num">${m.index}</span>`;
      html+=`<span class="dm-cn">${escape(m.chinese||'')}</span>`;
      if(m.register&&m.register!=='通用')html+=`<span class="dm-reg">${escape(m.register)}</span>`;
      if(m.explanation)html+=`<div class="dm-exp">${escape(m.explanation)}</div>`;
      if(m.example){html+=`<div class="dm-ex">${escape(m.example.ru||'')}</div><div class="dm-ex-cn">${escape(m.example.cn||'')}</div>`}
      html+='</div>'
    });
    html+='</div>'
  }

  // Declension
  if(d.declension){
    html+='<div class="dict-section"><div class="dict-section-title">变格</div>';
    html+=`<div class="grammar-mini">${escape(d.declension)}</div></div>`
  }

  // Conjugation
  if(d.conjugation){
    html+='<div class="dict-section"><div class="dict-section-title">变位</div>';
    html+=`<div class="grammar-mini">${escape(d.conjugation)}</div></div>`
  }

  // Aspect pair
  if(d.aspect_pair){
    html+='<div class="dict-section"><div class="dict-section-title">体的对应</div>';
    html+=`<div class="grammar-mini">未完成体: <b>${escape(d.aspect_pair.imperfective||'')}</b><br>完成体: <b>${escape(d.aspect_pair.perfective||'')}</b></div></div>`
  }

  // Collocations
  if(d.collocations&&d.collocations.length){
    html+='<div class="dict-section"><div class="dict-section-title">常用搭配</div><ul class="dict-list">';
    d.collocations.forEach(c=>{html+=`<li>${escape(c)}</li>`});
    html+='</ul></div>'
  }

  // Derivatives
  if(d.derivatives&&d.derivatives.length){
    html+='<div class="dict-section"><div class="dict-section-title">派生词</div><div class="dict-tags">';
    d.derivatives.forEach(w=>{html+=`<span class="dict-tag">${escape(w)}</span>`});
    html+='</div></div>'
  }

  // Synonyms
  if(d.synonyms&&d.synonyms.length){
    html+='<div class="dict-section"><div class="dict-section-title">近义词</div><div class="dict-tags">';
    d.synonyms.forEach(s=>{html+=`<span class="dict-tag">${escape(s)}</span>`});
    html+='</div></div>'
  }

  // Usage note
  if(d.usage_note){
    html+='<div class="dict-section"><div class="dict-section-title">用法提示</div>';
    html+=`<div class="grammar-mini">${escape(d.usage_note)}</div></div>`
  }

  html+='</div>';
  $dictResult.innerHTML=html;
}

],grammar:'<b>俄语字母</b>：共33个字母，10个元音 + 21个辅音 + 2个无音符号(ь,ъ)。<br><br><b>元音</b>：Аа Оо Уу Ээ Ыы Яя Ёё Юю Ее Ии<br><br><b>关键辅音</b>：Кк Гг Хх — 硬音；Чч Щщ — 永远软音；Жж Шш Цц — 永远硬音<br><br><b>重音</b>：俄语重音不固定，会影响元音发音。如 <span class="ex">молоко</span>（牛奶）读作 "малако"<br><br><b>语调</b>：疑问句用升调(ИК-3)，陈述句用降调(ИК-1)',quiz:[{q:'"谢谢" 的俄语是？',opts:['Спасибо','Пожалуйста','Извините','До свидания'],ans:0},{q:'"Да" 是什么意思？',opts:['不是','是的','谢谢','再见'],ans:1},{q:'俄语有几个字母？',opts:['26','33','30','28'],ans:1}]},

],grammar:'<b>名词的性</b>：<br>• 阳性：辅音结尾 + -й + -ь（部分）<br>• 阴性：-а/-я + -ь（部分）<br>• 中性：-о/-е/-мя<br><br><b>人称代词</b>：<table><tr><th>单数</th><th>复数</th></tr><tr><td>я 我</td><td>мы 我们</td></tr><tr><td>ты 你</td><td>вы 您/你们</td></tr><tr><td>он/она/оно 他/她/它</td><td>они 他们</td></tr></table><b>注意</b>：вы 可表示"您"(尊称单数)或"你们"(复数)',quiz:[{q:'"Кто это?" 是什么意思？',opts:['这是什么？','这是谁？','你在哪？','你好吗？'],ans:1},{q:'он 指的是？',opts:['她','他','它','我'],ans:1},{q:'哪个是阴性名词？',opts:['студент','друг','студентка','учитель'],ans:2}]},

{lesson:1,title:'高级语法结构',words:[{ru:'Причастие',cn:'形动词'},{ru:'Деепричастие',cn:'副动词'},{ru:'Сослагательное наклонение',cn:'虚拟语气'},{ru:'Условное предложение',cn:'条件句'},{ru:'Страдательный залог',cn:'被动语态'},{ru:'Прямая речь',cn:'直接引语'},{ru:'Косвенная речь',cn:'间接引语'},{ru:'Сложное предложение',cn:'复合句'},{ru:'Союз',cn:'连接词'}],grammar:'<b>形动词 (причастие)</b>：动词派生的形容词<br>• 主动形动词现在时：читающий（正在读的）<br>• 被动形动词过去时：прочитанный（已被读完的）<br><br><b>副动词 (деепричастие)</b>：表示伴随动作<br>• читая（在阅读时）<br>• прочитав（读完之后）',quiz:[{q:'形动词是？',opts:['动词的一种时态','动词派生的形容词','名词的一种格','一种连接词'],ans:1},{q:'"читая" 属于什么语法形式？',opts:['形动词','副动词','过去时','命令式'],ans:1}]},
{lesson:2,title:'社会与话题',words:[{ru:'Общество',cn:'社会'},{ru:'Экономика',cn:'经济'},{ru:'Политика',cn:'政治'},{ru:'Культура',cn:'文化'},{ru:'Образование',cn:'教育'},{ru:'Наука',cn:'科学'},{ru:'Технология',cn:'技术'},{ru:'Экология',cn:'生态'},{ru:'Традиция',cn:'传统'},{ru:'Закон',cn:'法律'},{ru:'Право',cn:'权利'},{ru:'Выборы',cn:'选举'},{ru:'СМИ',cn:'媒体'}],grammar:'<b>条件句</b>：если бы + 过去时 → 虚拟语气<br>Если бы я знал... — 要是我知道的话…<br><br><b>被动语态</b>：<br>Дом строится. — 房子正在被建<br>Дом был построен. — 房子被建好了',quiz:[{q:'"Образование" 意思是？',opts:['社会','教育','文化','科学'],ans:1}]},

let curBook=1,curLearnTab='book',curLesTab=0;

function renderLearn(){
  const el=document.getElementById('learnContent');
  if(curLearnTab==='book')renderBook(el);
  else if(curLearnTab==='major')renderMajor(el);
  else if(curLearnTab==='cefr')renderCefr(el);
  else renderLearnSettings(el);
}

function renderBook(el){
  const q=(document.getElementById('tbSearch')?document.getElementById('tbSearch').value:'').toLowerCase().trim();
  let lessons=VOCAB[curBook]||[];
  if(q){lessons=lessons.map(l=>{const w=l.words.filter(w=>w.ru.toLowerCase().includes(q)||w.cn.includes(q));return w.length?{...l,words:w}:null}).filter(Boolean);if(!lessons.length){el.innerHTML='<div class="empty-state">没有匹配的单词</div>';return}}
  el.innerHTML=`
    <div class="book-bar">${BOOKS.map(b=>`<button class="book-chip${b.id===curBook?' active':''}" data-bid="${b.id}">${b.title}</button>`).join('')}</div>
    <div class="search-box"><span class="sicon">🔍</span><input type="text" id="tbSearch" placeholder="搜索单词..." value="${escape(q)}"></div>
    <div class="les-scroll">${lessons.map((l,i)=>`
      <div class="les-card${i===0&&!q?' open':''}">
        <div class="les-card-hdr" onclick="this.closest('.les-card').classList.toggle('open')">
          <div><div class="les-num">Урок ${l.lesson}</div><div class="les-title">${l.title}</div></div>
          <span class="les-arrow">&#9660;</span>
        </div>
        <div class="les-card-body">
          <div class="les-tabs">
            <button class="les-tab active" onclick="switchLesTab(this,0,'${l.lesson}')">单词</button>
            <button class="les-tab" onclick="switchLesTab(this,1,'${l.lesson}')">语法</button>
            <button class="les-tab" onclick="switchLesTab(this,2,'${l.lesson}')">测试</button>
          </div>
          <div class="les-tab-content" id="lesTab_${l.lesson}_0">
            <div class="vocab-grid"><div class="grid-hdr">俄语</div><div class="grid-hdr">中文</div><div class="grid-hdr"></div>
            ${l.words.map(w=>`<div class="vg-ru"><span class="vg-act" onclick="event.stopPropagation();speakText('${w.ru.replace(/'/g,"\\'")}','ru')">&#9654;</span> ${w.ru}</div><div class="vg-cn">${w.cn}</div><span class="vg-act${S.favs.some(f=>f.ru===w.ru)?' saved':''}" onclick="event.stopPropagation();toggleFav('${w.ru.replace(/'/g,"\\'")}','${w.cn}')">${S.favs.some(f=>f.ru===w.ru)?'★':'☆'}</span>`).join('')}
            </div>
          </div>
          <div class="les-tab-content" id="lesTab_${l.lesson}_1" style="display:none">
            <div class="grammar-mini">${l.grammar||'暂无语法内容'}</div>
          </div>
          <div class="les-tab-content" id="lesTab_${l.lesson}_2" style="display:none">
            ${l.quiz?`<div class="quiz-mini" id="quiz_${l.lesson}">${renderLesQuiz(l.quiz,l.lesson)}</div>`:'<div class="grammar-mini">暂无测验</div>'}
          </div>
        </div>
      </div>`).join('')}</div>`;
  el.querySelectorAll('.book-chip').forEach(b=>b.addEventListener('click',()=>{curBook=parseInt(b.dataset.bid);renderLearn()}));
  el.querySelector('#tbSearch')?.addEventListener('input',()=>{renderLearn()});
}
function switchLesTab(btn,idx,lid){
  const card=btn.closest('.les-card-body');
  card.querySelectorAll('.les-tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');
  for(let i=0;i<3;i++){const t=card.querySelector(`#lesTab_${lid}_${i}`);if(t)t.style.display=i===idx?'block':'none'}
}
function renderLesQuiz(quiz,lid){
  return quiz.map((q,qi)=>`<div style="margin-bottom:12px"><div class="qm-q">${qi+1}. ${q.q}</div>${q.opts.map((o,oi)=>`<button class="qm-opt" onclick="answerLesQuiz(this,${oi},${q.ans},'quiz_${lid}',${qi})">${o}</button>`).join('')}<div class="qm-result" id="qr_${lid}_${qi}"></div></div>`).join('')
}
window.answerLesQuiz=function(btn,chosen,ans,quizId,qi){
  const btns=btn.parentElement.querySelectorAll('.qm-opt');
  btns.forEach(b=>b.disabled=true);
  btns[ans].classList.add('correct');
  const res=document.getElementById(`qr_${qi}_${quizId}`);
  if(chosen===ans){res.textContent='✓ 正确！';res.style.color='var(--green)';}else{btns[chosen].classList.add('wrong');res.textContent='✗ 错误，正确答案已标出';res.style.color='var(--red)';}
  res.style.display='block';
};
window.speakText=(t,l)=>speak(t,l,S.settings.speed);
window.toggleFav=toggleFav;

function renderMajor(el){
  let html=`<div style="font-weight:600;font-size:16px;margin-bottom:4px;color:var(--blue)">${CS_RUSSIAN.title}</div><div style="font-size:var(--fs-sm);color:var(--text3);margin-bottom:12px">${CS_RUSSIAN.desc}</div>`;
  CS_RUSSIAN.sections.forEach(s=>{
    if(s.words){
      html+=`<div class="les-card open"><div class="les-card-hdr" onclick="this.closest('.les-card').classList.toggle('open')"><div><div class="les-num">${s.title}</div></div><span class="les-arrow">&#9660;</span></div><div class="les-card-body"><div class="vocab-grid"><div class="grid-hdr">俄语</div><div class="grid-hdr">中文</div><div class="grid-hdr"></div>`;
      s.words.forEach(w=>{html+=`<div class="vg-ru"><span class="vg-act" onclick="event.stopPropagation();speakText('${w.ru.replace(/'/g,"\\'")}','ru')">&#9654;</span> ${w.ru}</div><div class="vg-cn">${w.cn}</div><span class="vg-act${S.favs.some(f=>f.ru===w.ru)?' saved':''}" onclick="event.stopPropagation();toggleFav('${w.ru.replace(/'/g,"\\'")}','${w.cn}')">${S.favs.some(f=>f.ru===w.ru)?'★':'☆'}</span>`});
      html+='</div></div></div>';
    }
    if(s.grammar){html+=`<div class="les-card open"><div class="les-card-hdr" onclick="this.closest('.les-card').classList.toggle('open')"><div><div class="les-num">${s.title}</div></div><span class="les-arrow">&#9660;</span></div><div class="les-card-body"><div class="grammar-mini">${s.grammar}</div></div></div>`}
  });
  el.innerHTML=html;
}

function renderCefr(el){
  let html=`<div style="font-weight:600;font-size:16px;margin-bottom:4px;color:var(--blue)">${CEFR.title}</div><div class="level-desc">${CEFR.desc}</div>`;
  CEFR.levels.forEach(lv=>{
    html+=`<div class="level-card"><div class="lc-title">${lv.name}</div><div class="level-desc">${lv.desc}</div><button class="lc-btn" onclick="startCefrTest('${lv.id}',this)">开始测试</button><div class="quiz-mini" id="cefrTest_${lv.id}" style="display:none;margin-top:12px"></div></div>`;
  });
  el.innerHTML=html;
}
window.startCefrTest=function(lid,btn){
  const lv=CEFR.levels.find(l=>l.id===lid);
  if(!lv||!lv.test)return;
  const el=document.getElementById('cefrTest_'+lid);
  el.style.display='block';
  el.innerHTML=lv.test.map((q,qi)=>`<div style="margin-bottom:12px"><div class="qm-q">${qi+1}. ${q.q}</div>${q.opts.map((o,oi)=>`<button class="qm-opt" onclick="answerCefr(this,${oi},${q.ans},'cefrTest_${lid}',${qi})">${o}</button>`).join('')}<div class="qm-result" id="cr_${lid}_${qi}"></div></div>`).join('');
  btn.style.display='none';
};
window.answerCefr=function(btn,chosen,ans,cid,qi){
  const btns=btn.parentElement.querySelectorAll('.qm-opt');
  btns.forEach(b=>b.disabled=true);
  btns[ans].classList.add('correct');

  res.style.display='block';
};

let quizState={};
function renderQuizSetup(){const el=document.getElementById('quizArea');el.innerHTML=`<div class="anim-in" style="text-align:center;padding:24px 0"><div style="font-size:16px;font-weight:500;margin-bottom:4px">单词测验</div><div style="font-size:var(--fs-sm);color:var(--text3);margin-bottom:12px">选择测验范围</div><div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0">${BOOKS.map(b=>`<button class="book-chip selected" data-b="${b.id}">${b.title}</button>`).join('')}</div><div style="font-size:var(--fs-sm);color:var(--text2);margin:8px 0">已选 <strong id="qzTotal">0</strong> 个单词</div><button class="lc-btn" id="qzStart" style="font-size:var(--fs)">开始测验</button></div>`;let selected=new Set([1,2,3,4]);function updateTotal(){let t=0;selected.forEach(bid=>{const l=VOCAB[bid];if(l)l.forEach(ls=>t+=ls.words.length)});document.getElementById('qzTotal').textContent=t}updateTotal();el.querySelectorAll('.book-chip').forEach(b=>b.addEventListener('click',()=>{const id=parseInt(b.dataset.b);b.classList.toggle('selected');if(b.classList.contains('selected'))selected.add(id);else selected.delete(id);if(!selected.size){selected.add(id);b.classList.add('selected')}updateTotal()}));document.getElementById('qzStart').addEventListener('click',()=>{const words=[];selected.forEach(bid=>{const l=VOCAB[bid];if(l)l.forEach(ls=>ls.words.forEach(w=>words.push({...w,book:bid})))});if(words.length<4){toast('至少需要4个单词');return}shuffle(words);quizState={words,idx:0,correct:0,wrong:[]};renderQuizQ()})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderQuizQ(){const qs=quizState;if(qs.idx>=qs.words.length){renderQuizResult();return}const w=qs.words[qs.idx];let opts=[w.cn];const pool=qs.words.filter(x=>x.cn!==w.cn);shuffle(pool);for(let i=0;i<3&&i<pool.length;i++)opts.push(pool[i].cn);if(opts.length<4){const all=Object.values(VOCAB).flatMap(l=>l.flatMap(ls=>ls.words)).filter(x=>!opts.includes(x.cn));shuffle(all);for(let i=0;opts.length<4&&i<all.length;i++)if(!opts.includes(all[i].cn))opts.push(all[i].cn)}shuffle(opts);const el=document.getElementById('quizArea');el.innerHTML=`<div class="anim-in" style="padding:24px 16px;text-align:center"><div style="font-size:var(--fs-sm);color:var(--text3);margin-bottom:10px">${qs.idx+1}/${qs.words.length}</div><div style="height:3px;border-radius:2px;background:var(--border);margin-bottom:20px;overflow:hidden"><div style="height:100%;border-radius:2px;background:var(--blue);transition:width .3s;width:${(qs.idx/qs.words.length*100)}%"></div></div><div style="font-size:28px;font-weight:500;color:var(--blue);margin-bottom:16px;line-height:1.4">${w.ru}</div><div style="display:grid;gap:8px" id="qOpts">${opts.map(o=>`<button style="padding:14px 16px;border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:var(--fs);text-align:left;border:1.5px solid var(--border)" data-v="${o}">${o}</button>`).join('')}</div></div>`;let answered=false;el.querySelectorAll('#qOpts button').forEach(btn=>{btn.addEventListener('click',()=>{if(answered)return;answered=true;const val=btn.textContent;const isCorrect=val===w.cn;if(isCorrect){qs.correct++;btn.style.borderColor='var(--green)';btn.style.color='var(--green)';btn.style.background='rgba(34,197,94,.08)'}else{btn.style.borderColor='var(--red)';btn.style.color='var(--red)';qs.wrong.push(w);el.querySelector(`#qOpts button[data-v="${escape(w.cn)}"]`).style.borderColor='var(--blue)';el.querySelector(`#qOpts button[data-v="${escape(w.cn)}"]`).style.color='var(--blue)'}const nb=document.createElement('button');nb.style.cssText='margin-top:16px;padding:11px 28px;border-radius:20px;background:var(--blue);color:#fff;font-weight:600;font-size:var(--fs-sm);border:none;cursor:pointer';nb.textContent=qs.idx+1>=qs.words.length?'查看结果':'下一题';nb.addEventListener('click',()=>{qs.idx++;renderQuizQ()});el.querySelector('.anim-in').appendChild(nb)})})}
function renderQuizResult(){const qs=quizState;const pct=Math.round(qs.correct/qs.words.length*100);document.getElementById('quizArea').innerHTML=`<div class="anim-in" style="text-align:center;padding:32px 16px"><div style="font-size:48px;font-weight:300;color:var(--blue);margin-bottom:4px">${qs.correct}/${qs.words.length}</div><div style="font-size:var(--fs-sm);color:var(--text2);margin-bottom:14px">正确率 ${pct}%</div><div style="font-size:var(--fs-sm);color:var(--text3);margin-bottom:20px;line-height:1.8">${qs.wrong.length?`需要复习：${qs.wrong.map(w=>w.ru+'('+w.cn+')').join('、')}`:'全部正确！'}</div><button style="padding:11px 24px;border-radius:20px;font-size:var(--fs-sm);background:var(--surface);color:var(--text2);border:1.5px solid var(--border);margin:4px;cursor:pointer" onclick="renderQuizSetup()">再来一次</button><button style="padding:11px 24px;border-radius:20px;font-size:var(--fs-sm);background:var(--surface);color:var(--text2);border:1.5px solid var(--border);margin:4px;cursor:pointer" onclick="document.querySelector('.nav-btn[data-screen=sLearn]').click()">去复习</button></div>`}
renderQuizSetup();

// ═══════════════════════════════════════════════════════════════
//  CLASS MODE (课堂语音翻译)
// ═══════════════════════════════════════════════════════════════
const CLASS={running:false,rec:null,items:[],pending:''};

function classAddItem(original,translation,note){
  const now=new Date();
  const time=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+':'+now.getSeconds().toString().padStart(2,'0');
  CLASS.items.push({time,original,translation,note:note||''});
  if(CLASS.items.length>200)CLASS.items.shift();
  classRender();
  const board=document.getElementById('classBoard');
  board.scrollTop=board.scrollHeight;
}

function classRender(){
  const el=document.getElementById('classBoard');
  document.getElementById('classCount').textContent=CLASS.items.length+' 句';
  if(!CLASS.items.length){el.innerHTML='<div class="empty-state" id="classEmpty">点击"开始录音"，老师说一句就显示一句<br>原文（大）＋ 译文（小），自动滚动</div>';return}
  el.innerHTML=CLASS.items.map((it,i)=>`
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:6px;animation:fadeIn .2s ease">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:10px;color:var(--text3)">${it.time}</span>
        <span style="display:flex;gap:6px">
          <span class="class-play" data-i="${i}" data-lang="ru" style="font-size:12px;color:var(--text2);padding:2px 8px;border-radius:12px;background:var(--input)">🔊原文</span>
          <span class="class-play" data-i="${i}" data-lang="zh" style="font-size:12px;color:var(--text2);padding:2px 8px;border-radius:12px;background:var(--input)">🔊译文</span>
        </span>
      </div>
      <div style="font-size:17px;font-weight:600;color:var(--text);line-height:1.4;margin-bottom:3px">${escape(it.original)}</div>
      <div style="font-size:14px;color:var(--blue);line-height:1.5">${escape(it.translation)}</div>
      ${it.note?`<div style="font-size:11px;color:var(--yellow);margin-top:3px">⚠️ ${escape(it.note)}</div>`:''}
    </div>`).join('');
  el.querySelectorAll('.class-play').forEach(b=>{
    b.addEventListener('click',()=>{
      const it=CLASS.items[parseInt(b.dataset.i)];
      if(it)speak(b.dataset.lang==='ru'?it.original:it.translation,b.dataset.lang==='ru'?'ru':'zh-CN',.9);
    });
  });
}

async function classTranslate(text){
  if(!S.settings.dsKey){return{original:text,translation:'（需要 DeepSeek Key 才能翻译，请在设置中填写）',note:''}}
  try{
    const resp=await fetch('http://localhost:8765/api/class-translate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:S.settings.dsKey,text}),signal:AbortSignal.timeout(35000)});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const d=await resp.json();
    if(d.error)throw new Error(d.error);
    return{original:d.original||text,translation:d.translation||'',note:d.note||''};
  }catch(e){
    return{original:text,translation:'（翻译失败: '+e.message+'）',note:''};
  }
}

function classStart(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const status=document.getElementById('classStatus');
  if(!SR){
    status.textContent='❌ 浏览器不支持';
    document.getElementById('classHint').innerHTML='请用 <b>Chrome 或 Edge</b> 打开本页面使用语音识别';
    return;
  }
  CLASS.running=true;
  document.getElementById('classStartBtn').disabled=true;
  document.getElementById('classStopBtn').disabled=false;
  status.textContent='🎙️ 聆听中…';
  const rec=new SR();
  CLASS.rec=rec;
  rec.lang='ru-RU';
  rec.continuous=true;
  rec.interimResults=true;
  rec.maxAlternatives=1;
  rec.onresult=e=>{
    let finalText='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)finalText+=e.results[i][0].transcript+' ';
    }
    // 显示临时识别文字
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(!e.results[i].isFinal)interim+=e.results[i][0].transcript;
    }
    document.getElementById('classHint').innerHTML='<span style="color:var(--text2)">'+(interim?'正在识别: '+escape(interim):'聆听中…')+'</span>';
    // 句子结束 → 翻译
    if(finalText.trim()){
      classTranslate(finalText.trim()).then(r=>{
        classAddItem(r.original,r.translation,r.note);
        document.getElementById('classHint').innerHTML='说俄语 → 自动转文字 → 翻译显示';
      });
    }
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      status.textContent='❌ 麦克风被拒绝';
      document.getElementById('classHint').innerHTML='浏览器地址栏 🔒 → 网站设置 → 允许麦克风';
    }else if(e.error==='network'){
      status.textContent='⚠️ 识别服务连不上（网络）';
      document.getElementById('classHint').innerHTML='Web Speech API 依赖云端服务。Whisper 本地方案接入后不再依赖网络';
    }
  };
  rec.onend=()=>{if(CLASS.running){try{rec.start()}catch(e){}}}; // 自动续听
  try{rec.start()}catch(e){}
}

function classStop(){
  CLASS.running=false;
  if(CLASS.rec){CLASS.rec.onend=null;try{CLASS.rec.stop()}catch(e){}CLASS.rec=null}
  document.getElementById('classStartBtn').disabled=false;
  document.getElementById('classStopBtn').disabled=true;
  document.getElementById('classStatus').textContent='已停止';
}

function classSave(){
  if(!CLASS.items.length){toast('还没有记录');return}
  const date=new Date().toISOString().slice(0,10);
  const all=ls('class_records',{});
  all[date]=CLASS.items.slice();
  ss('class_records',all);
  const text=CLASS.items.map((it,i)=>`${i+1}. [${it.time}] ${it.original}\n    ${it.translation}${it.note?' ⚠️'+it.note:''}`).join('\n\n');
  try{navigator.clipboard.writeText(text).then(()=>toast('已保存到本地，已复制到剪贴板'))}catch(e){toast('已保存到本地')}
}

function classClear(){
  if(CLASS.items.length&&!confirm('清空当前字幕板？'))return;
  CLASS.items=[];
  classRender();
}

document.getElementById('classStartBtn').addEventListener('click',classStart);
document.getElementById('classStopBtn').addEventListener('click',classStop);
document.getElementById('classSaveBtn').addEventListener('click',classSave);
document.getElementById('classClearBtn').addEventListener('click',classClear);

function renderAppSettings(){const s=S.settings,el=document.getElementById('appSettingsContent');el.innerHTML=`<div class="setting-group"><div class="setting-group-title">语音</div><div class="setting-card"><div class="s-label">朗读速度</div><div class="spd-grid" style="margin-top:6px">${CFG.speeds.map(sp=>`<button class="spd-chip${s.speed===sp?' active':''}" data-sp="${sp}">${sp}x</button>`).join('')}</div></div><div class="setting-card"><div class="s-label">字体大小</div><div class="s-row" style="margin-top:6px"><input type="range" id="fsSlider" min="${CFG.fsRange[0]}" max="${CFG.fsRange[1]}" value="${s.fontSize}" style="flex:1"><span style="margin-left:10px;font-weight:500;color:var(--blue);min-width:28px">${s.fontSize}</span></div></div></div><div class="setting-group"><div class="setting-group-title">翻译引擎（快速模式）</div>${CFG.models.map(m=>`<div style="padding:10px 14px;border-radius:var(--radius-sm);border:1.5px solid var(--border);margin-bottom:6px;cursor:pointer;background:${s.model===m.id?'var(--blue-bg)':'var(--surface)'};border-color:${s.model===m.id?'var(--blue)':'var(--border)'}" data-mdl="${m.id}"><div style="font-size:var(--fs-sm);font-weight:500;margin-bottom:2px;display:flex;justify-content:space-between">${m.name}${s.model===m.id?' <span style=color:var(--blue)>✓</span>':''}</div><div style="font-size:var(--fs-xs);color:var(--text3)">${m.desc}</div></div>`).join('')}</div><div class="setting-group"><div class="setting-group-title">DeepSeek API</div><div class="setting-card"><div class="s-label">API Key</div><div class="s-desc">深度翻译、字典和单词分析共用</div><input type="password" id="dsKeyInput" value="${s.dsKey||''}" placeholder="sk-..." style="margin-top:6px;font-size:var(--fs-sm)"><button id="dsKeySave" style="margin-top:8px;padding:6px 16px;border-radius:6px;font-size:12px;background:var(--blue);color:#fff;font-weight:600">保存</button><span id="dsKeyMsg" style="font-size:11px;color:var(--text3);margin-left:8px"></span></div></div><div class="setting-group"><div class="about-box" style="text-align:center;padding:20px 0;color:var(--text3);font-size:var(--fs-sm);line-height:1.9">俄语学习 v5.0<br>俄·英·中 三语互译 + 高质量字典<br>单词变位标签 · 一词多译<br>走遍俄罗斯 1-4 + 计算机专业俄语<br>CEFR A1-C2 等级考试<br>翻译: MyMemory + LibreTranslate + DeepSeek</div></div>`;const fsl2=document.getElementById('fsSlider');if(fsl2)fsl2.addEventListener('input',function(){applyFont(parseInt(this.value));this.nextElementSibling.textContent=this.value});el.querySelectorAll('.spd-chip').forEach(b=>b.addEventListener('click',function(){el.querySelectorAll('.spd-chip').forEach(x=>x.classList.remove('active'));this.classList.add('active');S.settings.speed=parseFloat(this.dataset.sp);save('settings');toast('速度: '+S.settings.speed+'x')}));el.querySelectorAll('[data-mdl]').forEach(c=>c.addEventListener('click',function(){S.settings.model=this.dataset.mdl;save('settings');renderAppSettings();toast('已切换')}));const kb2=document.getElementById('dsKeySave');if(kb2)kb2.addEventListener('click',()=>{S.settings.dsKey=document.getElementById('dsKeyInput').value.trim();save('settings');document.getElementById('dsKeyMsg').textContent='已保存';setTimeout(()=>document.getElementById('dsKeyMsg').textContent='',2000)})}
renderAppSettings();
document.querySelectorAll('#sMore .sub-tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('#sMore .sub-tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');const id=b.dataset.more;document.getElementById('subFav').style.display=id==='fav'?'block':'none';document.getElementById('subAppSettings').style.display=id==='app-settings'?'block':'none'}));

// ═══ 系统诊断 ═══
window.runDiagnose=async function(btn){
  const el=document.getElementById('diagResult');
  el.innerHTML='<div style="color:var(--text3)">检查中…</div>';
  btn.disabled=true;
  const lines=[];
  // 1. 代理可达 + 各服务状态
  try{
    const r=await fetch('http://localhost:8765/api/diagnose',{signal:AbortSignal.timeout(15000)});
    if(r.ok){
      const d=await r.json();
      lines.push('🖥️ 代理服务器: '+(d.server==='ok'?'✅ 运行中':'⚠️ 异常'));
      d.checks.forEach(c=>lines.push((c.ok?'✅':'❌')+' '+c.name+': '+c.detail));
    }else{
      lines.push('❌ 代理响应异常: HTTP '+r.status);
    }
  }catch(e){
    lines.push('❌ 代理服务器不可达: '+e.message);
    lines.push('   → 电脑上运行: cd russian-app && node proxy.js');
  }
  // 2. DeepSeek Key
  if(S.settings.dsKey){
    lines.push('🔑 DeepSeek Key: 已配置 ('+S.settings.dsKey.slice(0,8)+'…)');
  }else{
    lines.push('⚠️ DeepSeek Key: 未配置（深度翻译/字典/变位需要）');
  }
  // 3. Service Worker
  if(navigator.serviceWorker){
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      lines.push(regs.length?('ℹ️ Service Worker: '+regs.length+' 个已注册（页面异常时去 /clear-cache.html 清理）'):'ℹ️ Service Worker: 未注册');
    }catch(e){}
  }
  el.innerHTML=lines.join('<br>')+'<br><button style="margin-top:8px;padding:5px 12px;border-radius:6px;font-size:11px;background:var(--input);color:var(--text2)" onclick="window.open(\'/clear-cache.html\',\'_blank\')">🧹 打开缓存清理页</button>';
  btn.disabled=false;
};
