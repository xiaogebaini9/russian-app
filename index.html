<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#d9e7f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>俄语学习</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="orb a" aria-hidden="true"></div>
<div class="orb b" aria-hidden="true"></div>
<div class="orb c" aria-hidden="true"></div>
<div class="noise" aria-hidden="true"></div>
<div class="app" id="app">
  <header class="header"><h1>俄语学习</h1><button class="btn-dict" id="btnOpenDict">📖 字典</button></header>
  <div class="content" id="content">

    <!-- ══ TRANSLATE ══ -->
    <div class="screen active" id="sTranslate">
      <div class="lang-bar">
        <div class="lang-sel" id="srcSel">
          <button class="lang-sel-btn" id="srcLangBtn">俄语</button>
          <div class="lang-popup" id="srcPopup">
            <button data-lang="ru" class="active">Русский</button>
            <button data-lang="en">English</button>
            <button data-lang="zh-CN">中文</button>
          </div>
        </div>
        <button class="swap-btn" id="swapLang">⇄</button>
        <div class="lang-sel" id="tgtSel">
          <button class="lang-sel-btn" id="tgtLangBtn">中文</button>
          <div class="lang-popup" id="tgtPopup">
            <button data-lang="zh-CN" class="active">中文</button>
            <button data-lang="en">English</button>
            <button data-lang="ru">Русский</button>
          </div>
        </div>
      </div>
      <div class="tr-input-wrap">
        <textarea id="trInput" placeholder="输入文本..." rows="2" autocomplete="off"></textarea>
        <div class="tr-mode-wrap">
          <button class="tr-mode-trigger" id="modeTrigger">⚡ 快速</button>
          <div class="tr-mode-popup" id="modePopup">
            <button data-mode="fast" class="active"><span>⚡ 快速</span><span class="pop-label">免费引擎</span></button>
            <button data-mode="deep"><span>🧠 深度</span><span class="pop-label">DeepSeek</span></button>
          </div>
        </div>
        <button class="clear-btn" id="clearInput">✕</button>
      </div>
      <div class="tr-options">
        <label class="auto-toggle"><span class="toggle-track on" id="autoToggle"></span><span>自动翻译</span></label>
        <div style="display:flex;align-items:center;gap:10px">
          <span style="font-size:11px;color:var(--text3)" id="charCount">0</span>
          <span class="history-trigger" id="historyTrigger">📄 记录<span class="ht-count" id="htCount">0</span></span>
        </div>
      </div>
      <div class="tr-actions">
        <button class="btn-translate" id="btnTranslate">&#9654;</button>
        <button class="btn-speak" id="btnSpeak" disabled>🔊 朗读</button>
      </div>
      <div id="trResult"></div>
    </div>

    <!-- ══ DICTIONARY ══ -->
    <div class="screen" id="sDict">
      <div class="dict-header">
        <button class="dict-back" id="btnBackTranslate">←</button>
        <span class="dict-title">📖 字典</span>
      </div>
      <div class="dict-input-wrap">
        <input type="text" id="dictInput" placeholder="输入俄语单词..." autocomplete="off">
        <button class="dict-search-btn" id="btnDictSearch">🔍</button>
      </div>
      <div class="dict-result" id="dictResult">
        <div class="empty-state">输入俄语单词，查看高质量词典释义</div>
      </div>
    </div>

    <!-- ══ LEARN ══ -->
    <div class="screen" id="sLearn">
      <div class="subj-tabs" id="subjTabs">
        <button class="subj-tab active" data-subj="ru">🇷🇺 俄语</button>
        <button class="subj-tab" data-subj="en">🇬🇧 英语</button>
      </div>
      <div class="sub-tabs" id="learnTabs">
        <button class="sub-tab active" data-tab="book">课本</button>
        <button class="sub-tab" data-tab="major">专业俄语</button>
        <button class="sub-tab" data-tab="cefr">等级考试</button>
        <button class="sub-tab" data-tab="settings">设置</button>
      </div>
      <div id="learnContent" style="flex:1;overflow-y:auto;min-height:0"></div>
    </div>

    <!-- ══ QUIZ ══ -->
    <div class="screen" id="sQuiz">
      <div class="sub-tabs" style="margin-bottom:10px;flex-shrink:0">
        <button class="sub-tab active" data-pq="practice">🎯 刷题练习</button>
        <button class="sub-tab" data-pq="oldquiz">📝 单词测验</button>
      </div>
      <div id="practiceArea" style="flex:1;overflow-y:auto;min-height:0"></div>
      <div id="quizArea" style="display:none;flex:1;overflow-y:auto;min-height:0"></div>
    </div>

    <!-- ══ CLASS MODE (课堂语音翻译) ══ -->
    <div class="screen" id="sClass">
      <div style="padding:10px 0;flex-shrink:0">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <span style="font-weight:600;font-size:15px;color:var(--blue)">🎤 课堂模式</span>
          <span id="classStatus" style="font-size:11px;color:var(--text3)">未开始</span>
          <span style="flex:1"></span>
          <button id="classTermsBtn" class="mini-chip">📖 术语</button>
          <button id="classScrollBtn" class="mini-chip">⏸ 滚动</button>
          <button id="classHistBtn" class="mini-chip">📚 历史</button>
          <span style="font-size:11px;color:var(--text3)" id="classCount">0 句</span>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:10px">
          <button id="classStartBtn" style="flex:1;padding:13px 0;border-radius:var(--radius-sm);font-size:14px;font-weight:700;background:var(--blue);color:#fff">🎙️ 开始录音</button>
          <button id="classStopBtn" style="flex:1;padding:13px 0;border-radius:var(--radius-sm);font-size:14px;font-weight:700;background:var(--input);color:var(--text2);border:1.5px solid var(--border)" disabled>⏹ 停止</button>
        </div>
        <div style="font-size:11px;color:var(--text3);line-height:1.6;margin-bottom:6px" id="classHint">
          说俄语 → 自动转文字 → 翻译显示。识别引擎：<b id="classEngine">检测中…</b>
        </div>
        <div id="classTermsPanel" style="display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;margin-bottom:8px">
          <div style="display:flex;gap:6px;margin-bottom:6px">
            <input id="classTermRu" placeholder="русский 术语" style="flex:1;padding:7px 10px;font-size:12px;background:var(--input);border:1.5px solid var(--border);border-radius:8px;color:var(--text)">
            <input id="classTermCn" placeholder="中文翻译" style="flex:1;padding:7px 10px;font-size:12px;background:var(--input);border:1.5px solid var(--border);border-radius:8px;color:var(--text)">
            <button id="classTermAdd" style="padding:7px 12px;border-radius:8px;font-size:12px;background:var(--blue);color:#fff;border:none;cursor:pointer">添加</button>
          </div>
          <div id="classTermsList" style="font-size:12px;max-height:120px;overflow-y:auto"></div>
          <div style="font-size:10px;color:var(--text3);margin-top:4px">术语会注入课堂翻译，保证整节课译法统一</div>
        </div>
      </div>
      <div id="classBoard" style="flex:1;overflow-y:auto;min-height:0;padding-bottom:10px">
        <div class="empty-state" id="classEmpty">点击"开始录音"，老师说一句就显示一句<br>原文（大）＋ 译文（小），自动滚动</div>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0;padding-bottom:8px">
        <button id="classSaveBtn" style="flex:1;padding:9px 0;border-radius:var(--radius-sm);font-size:12px;background:var(--surface);color:var(--text2);border:1.5px solid var(--border)">💾 复制本课记录</button>
        <button id="classClearBtn" style="flex:1;padding:9px 0;border-radius:var(--radius-sm);font-size:12px;background:var(--surface);color:var(--text2);border:1.5px solid var(--border)">🧹 清空</button>
      </div>
    </div>

    <!-- ══ MORE ══ -->
    <div class="screen" id="sMore">
      <div class="sub-tabs" style="margin-bottom:10px">
        <button class="sub-tab active" data-more="fav">收藏</button>
        <button class="sub-tab" data-more="res">📖 资料</button>
        <button class="sub-tab" data-more="app-settings">设置</button>
      </div>
      <div id="subFav" style="flex:1;overflow-y:auto">
        <div class="fav-stats" id="favStats">已收藏 <strong>0</strong> 个单词</div>
        <div style="display:flex;gap:6px;margin-bottom:8px">
          <button id="favExport" style="flex:1;padding:8px 0;border-radius:8px;font-size:12px;background:var(--surface);color:var(--text2);border:1.5px solid var(--border)">⬇️ 导出</button>
          <button id="favImport" style="flex:1;padding:8px 0;border-radius:8px;font-size:12px;background:var(--surface);color:var(--text2);border:1.5px solid var(--border)">⬆️ 导入</button>
        </div>
        <div id="favList"><div class="empty-state">还没有收藏的单词</div></div>
      </div>
      <div id="subRes" style="display:none;flex:1;overflow-y:auto"><div id="resContent"></div></div>
      <div id="subAppSettings" style="display:none;flex:1;overflow-y:auto"><div id="appSettingsContent"></div></div>
    </div>
  </div>

  <nav class="nav" id="nav">
    <button class="nav-btn active" data-screen="sTranslate"><span class="icon">🌐</span><span>翻译</span></button>
    <button class="nav-btn" data-screen="sLearn"><span class="icon">📚</span><span>学习</span></button>
    <button class="nav-btn" data-screen="sQuiz"><span class="icon">🎯</span><span>测验</span></button>
    <button class="nav-btn" data-screen="sClass"><span class="icon">🎤</span><span>课堂</span></button>
    <button class="nav-btn" data-screen="sMore"><span class="icon">📦</span><span>更多</span></button>
  </nav>
</div>

<div class="toast" id="toast"></div>
<div class="history-popup" id="historyPopup">
  <div class="hp-panel">
    <div class="hp-hdr"><span class="hp-title">翻译记录</span><div style="display:flex;align-items:center;gap:8px"><button id="popupClearHistory" style="font-size:12px;color:var(--text2)">清空</button><button class="hp-close" id="popupClose">✕</button></div></div>
    <div class="hp-list" id="popupHistoryList"><div class="empty-state">暂无记录</div></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  TRANSLATION ENGINE (unchanged core)
// ═══════════════════════════════════════════════════════════════
const LANGS={ru:'俄语',en:'英语','zh-CN':'中文'};
const LANG_TO_API={ru:'ru',en:'en','zh-CN':'zh-CN'};
const CFG={models:[{id:'mymemory',name:'MyMemory',desc:'神经网络翻译引擎，免费不限次',api:'https://api.mymemory.translated.net/get'},{id:'libre',name:'LibreTranslate',desc:'开源翻译引擎，俄语翻译优秀',api:'https://translate.terraprint.co/translate'}],speeds:[0.25,0.5,0.75,1,1.25,1.5,1.75,2],fsRange:[13,24]};
function ls(k,d){try{return JSON.parse(localStorage.getItem('ru_'+k))||d}catch{return d}}
function ss(k,v){localStorage.setItem('ru_'+k,JSON.stringify(v))}
const S={settings:ls('settings',{model:'mymemory',speed:.75,fontSize:16,autoTr:true,mode:'fast',dsKey:'',apiBase:''}),history:ls('history',[]),favs:ls('favs',[]),isSpeaking:false,result:null,langSrc:'ru',langTgt:'zh-CN'};
function save(k){ss(k,S[k])}
const pzLang=()=>S.settings.plang==='en'?'en':'ru'; // 当前练习/学习语言（ru/en），定义在前供全脚本使用
function pzFixBook(bid,lang){bid=parseInt(bid)||0;if(lang==='en')return(bid>=100&&bid<=104)?bid:101;return(bid>=1&&bid<=4)?bid:1;} // 清理跨语言污染的书号
const API_BASE=(S.settings.apiBase&&S.settings.apiBase.trim())||'https://aimisi.top';

// ⚡ 统一 API 调用：超时、错误提取、snippet 诊断信息一处收敛（SW 503 的"离线模式"JSON 自然流进 friendlyErr）
async function apiFetch(path,{method='POST',body,timeout=60000,headers={}}={}){
  const resp=await fetch(API_BASE+path,{method,headers:Object.assign({'Content-Type':'application/json'},headers),body:body!==undefined?JSON.stringify(body):undefined,signal:AbortSignal.timeout(timeout)});
  const d=await resp.json().catch(()=>({})); // ⚡ 有的上游把 error 返回成对象，这里统一转字符串，避免页面显示 [object Object]
  if(d.error&&typeof d.error!=='string')d.error=d.error.message||JSON.stringify(d.error);
  if(!resp.ok)throw new Error(d.error||('HTTP '+resp.status));
  if(d.error)throw new Error(d.error+(d.snippet?' | 模型返回: '+d.snippet:''));
  return d;
}

let _tt;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2200)}

// ═══ SCREEN SWITCHING ═══
function showTranslate(){hideDict();document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('sTranslate').classList.add('active');document.querySelector('.nav-btn[data-screen=sTranslate]').classList.add('active');document.getElementById('content').scrollTop=0;updateDictBtnVisibility()}
function showDict(){document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('sDict').classList.add('active');document.getElementById('content').scrollTop=0;updateDictBtnVisibility()}
function hideDict(){updateDictBtnVisibility()}
// ⚡ 通用切屏/切子页（复用 nav 按钮的既有处理器，一处定义全站生效）
function showScreen(name){const b=document.querySelector('.nav-btn[data-screen='+name+']');if(b)b.click()}
function showMoreTab(name){const b=document.querySelector('#sMore .sub-tab[data-more='+name+']');if(b)b.click()}
function updateDictBtnVisibility(){const inDict=document.getElementById('sDict').classList.contains('active');document.getElementById('btnOpenDict').style.display=inDict?'none':''}

// Nav
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.screen).classList.add('active');document.getElementById('content').scrollTop=0;updateDictBtnVisibility()}));

// Dict ↔ Translate
document.getElementById('btnOpenDict').addEventListener('click',showDict);
document.getElementById('btnBackTranslate').addEventListener('click',showTranslate);

// Lang selectors
function updateLangUI(){document.getElementById('srcLangBtn').textContent=LANGS[S.langSrc];document.getElementById('tgtLangBtn').textContent=LANGS[S.langTgt];document.querySelectorAll('#srcPopup button').forEach(b=>b.classList.toggle('active',b.dataset.lang===S.langSrc));document.querySelectorAll('#tgtPopup button').forEach(b=>b.classList.toggle('active',b.dataset.lang===S.langTgt))}
document.getElementById('srcLangBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('srcPopup').classList.toggle('show');document.getElementById('tgtPopup').classList.remove('show')});
document.querySelectorAll('#srcPopup button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();S.langSrc=b.dataset.lang;if(S.langSrc===S.langTgt)S.langTgt=S.langSrc==='zh-CN'?'ru':'zh-CN';updateLangUI();document.getElementById('srcPopup').classList.remove('show');if(document.getElementById('trInput').value.trim())doTranslate()}));
document.getElementById('tgtLangBtn').addEventListener('click',e=>{e.stopPropagation();document.getElementById('tgtPopup').classList.toggle('show');document.getElementById('srcPopup').classList.remove('show')});
document.querySelectorAll('#tgtPopup button').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();S.langTgt=b.dataset.lang;if(S.langSrc===S.langTgt)S.langSrc=S.langTgt==='zh-CN'?'ru':'zh-CN';updateLangUI();document.getElementById('tgtPopup').classList.remove('show');if(document.getElementById('trInput').value.trim())doTranslate()}));
document.getElementById('swapLang').addEventListener('click',()=>{const t=document.getElementById('trInput').value.trim();if(t){const d=detectLang(t);if(d==='ru'||d==='en'||d==='zh-CN'){const all=['ru','en','zh-CN'];S.langSrc=d;S.langTgt=all.find(l=>l!==d&&l!==S.langTgt)||(d==='zh-CN'?'en':'zh-CN')}else{[S.langSrc,S.langTgt]=[S.langTgt,S.langSrc]}}else{[S.langSrc,S.langTgt]=[S.langTgt,S.langSrc]}updateLangUI();if(t)doTranslate()});
document.addEventListener('click',()=>{document.getElementById('srcPopup').classList.remove('show');document.getElementById('tgtPopup').classList.remove('show')});
function detectLang(t){if(/[а-яА-ЯёЁ]/.test(t))return'ru';if(/[一-鿿]/.test(t))return'zh-CN';return'en'}
function autoSrcLang(t){const d=detectLang(t);if(S.langSrc!==d&&(d==='ru'||d==='en'||d==='zh-CN')){S.langSrc=d;updateLangUI()}}

function applyFont(v){const r=document.documentElement;r.style.setProperty('--fs',v+'px');r.style.setProperty('--fs-sm',Math.max(11,v-3)+'px');r.style.setProperty('--fs-xs',Math.max(9,v-5)+'px');S.settings.fontSize=v;save('settings')}

// Translate
// Translate (with fallback: if configured engine fails, try MyMemory)
async function translateFree(txt,mid){
  if(!txt.trim())return null;
  const src=LANG_TO_API[S.langSrc],tgt=LANG_TO_API[S.langTgt];
  const tryLibre=async()=>{const lz={ru:'ru',en:'en','zh-CN':'zh'};const r=await fetch(CFG.models[1].api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({q:txt,source:lz[src],target:lz[tgt],format:'text'}),signal:AbortSignal.timeout(8000)});const d=await r.json();if(d.translatedText)return{text:d.translatedText,det:'LibreTranslate'};throw new Error(d.error||'失败')};
  const tryMyMemory=async()=>{const r=await fetch(`${CFG.models[0].api}?q=${encodeURIComponent(txt)}&langpair=${src}|${tgt}`,{signal:AbortSignal.timeout(8000)});const d=await r.json();if(d.responseStatus===200&&d.responseData)return{text:d.responseData.translatedText,det:'MyMemory'};throw new Error(d.responseDetails||'失败')};
  if(mid==='mymemory'){
    try{return await tryMyMemory()}catch(e){try{return await tryLibre()}catch(e2){throw new Error(e.message||'失败')}}
  }else{
    try{return await tryLibre()}catch(e){try{return await tryMyMemory()}catch(e2){throw new Error(e.message||'失败')}}
  }
}
async function translateDeepSeek(txt){if(!txt.trim())return null;const d=await apiFetch('/api/translate',{body:{key:S.settings.dsKey,src:S.langSrc,tgt:S.langTgt,text:txt},timeout:20000});return{text:d.text,det:'DeepSeek'}}
function escape(s){return String(s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]))}

// ⚡ 通用小工具
const jsStr=s=>String(s).replace(/'/g,"\\'"); // onclick 内联参数转义
function loadingHTML(hint){return '<div class="lds"><span></span><span></span><span></span></div>'+(hint?'<div style="text-align:center;font-size:12px;color:var(--text3)">'+hint+'</div>':'')}
function favMatch(f,x){return (f.ru&&f.ru===x)||(f.cn&&f.cn===x)||(f.en&&f.en===x)} // 收藏匹配（任一语言字段命中）
function isFavWord(x){return S.favs.some(f=>favMatch(f,x))}

// ⚡ 把技术性错误翻译成用户能看懂的话
function friendlyErr(e){
  const m=(e&&e.message)||String(e||'');
  if(/离线/.test(m))return '网络不可用：深度功能需要电脑端代理运行（node proxy.js），请先启动代理';
  if(/Failed to fetch|fetch failed|NetworkError|network error|ERR_CONNECTION/i.test(m))return '网络不可用，请检查网络连接或代理是否运行';
  if(/auth|invalid api key|unauthorized|authentication/i.test(m))return 'API Key 无效或已过期，请到「更多 → 设置」重新填写';
  if(/timed out|超时|abort/i.test(m))return '请求超时，请重试';
  if(/HTTP 5\d\d|503|502|500|not available/i.test(m))return '服务暂时不可用，请稍后重试';
  if(/\[object Object\]/.test(m))return '错误信息获取失败，请打开浏览器控制台（F12）查看详情';
  return m;
}

// ⚡ 引导去设置页填 Key（替代原生 prompt 弹窗，手机/PWA 上体验更好）
function gotoKeySetup(msg){
  toast('🔑 '+msg+'：请到「更多 → 设置」填写');
  showScreen('sMore');
  showMoreTab('app-settings');
}

const speakWarned={}; // 每种语言只提示一次语音缺失
let voicesCache=[]; // 语音列表缓存（onvoiceschanged 时刷新，朗读热路径不重复枚举）
function refreshVoices(){voicesCache=window.speechSynthesis?window.speechSynthesis.getVoices():[]}

// ═══ Check if text is a single Russian word ═══
function isSingleRussianWord(txt){return !!cleanRussianWord(txt)}
// 清洗标点后取俄语单词（"читать。" → "читать"，多词/非俄语 → null）
function cleanRussianWord(txt){
  if(!txt)return null;
  const t=txt.trim().replace(/[.,;:!?…"«»()\-—'’‘。！？，、；：]/g,'').trim();
  if(t.indexOf(' ')>-1)return null;
  return /^[а-яА-ЯёЁ]+$/i.test(t)?t:null;
}

// ═══ Fetch word analysis (aspect + time conjugation + multi meanings) ═══
async function fetchWordAnalysis(word){
  const key='wa_'+word.toLowerCase().trim();
  try{
    const hit=ls(key);
    if(hit&&hit.data&&Date.now()-hit.t<30*24*3600*1000)return hit.data; // 词形变化是语言事实，localStorage 缓存30天，重启不丢
    const r=await apiFetch('/api/word-analysis',{body:{key:S.settings.dsKey,word},timeout:60000});
    if(r&&!r._error)ss(key,{t:Date.now(),data:r});
    return r;
  }catch(e){return {_error:e.message}}
}
async function fetchSentAnalysis(text,lang){
  lang=lang||'ru';
  const key='sa_'+lang+'_'+text.trim();
  try{
    const hit=ls(key);
    if(hit&&hit.data&&Date.now()-hit.t<30*24*3600*1000)return hit.data; // 句子解析缓存30天，同句秒出
    const r=await apiFetch('/api/sentence-analysis',{body:{key:S.settings.dsKey,text,lang},timeout:120000});
    if(r&&!r._error&&r.structure)ss(key,{t:Date.now(),data:r});
    return r;
  }catch(e){return {_error:e.message}}
}

// ═══ Render Aspect Panel (完成体/未完成体) ═══
function renderAspectPanel(analysis){
  if(!analysis)return'';
  const a=analysis.aspect;
  let html='<div class="conj-section"><div class="dict-section-title">🔄 完成体 / 未完成体</div>';
  if(!a){
    html+='<div style="color:var(--text3);font-size:13px;padding:4px 0">该词不是动词，没有体的变化</div></div>';
    return html;
  }

  if(a.imperfective){
    const imp=a.imperfective;
    html+='<div class="conj-label"><b>未完成体 (НСВ)</b> — 过程、重复、持续'+(imp.infinitive?'<br>不定式: <b style="color:var(--blue)">'+escape(imp.infinitive)+'</b>':'')+'</div>';
    html+='<table class="conj-table">';
    if(imp.past)html+=`<tr><td class="pronoun">过去时</td><td>${imp.past.masc||'—'} / ${imp.past.fem||'—'} / ${imp.past.neut||'—'} / ${imp.past.plur||'—'}</td></tr>`;
    if(imp.present)html+=`<tr><td class="pronoun">现在时</td><td>${imp.present['я']||'—'} / ${imp.present['ты']||'—'} / ${imp.present['он']||'—'} / ${imp.present['мы']||'—'} / ${imp.present['вы']||'—'} / ${imp.present['они']||'—'}</td></tr>`;
    if(imp.future)html+=`<tr><td class="pronoun">将来时</td><td>${imp.future['я']||'—'} / ${imp.future['ты']||'—'} / ${imp.future['он']||'—'} / ${imp.future['мы']||'—'} / ${imp.future['вы']||'—'} / ${imp.future['они']||'—'}</td></tr>`;
    if(imp.imperative)html+=`<tr><td class="pronoun">命令式</td><td>${imp.imperative.sg||'—'} / ${imp.imperative.pl||'—'}</td></tr>`;
    if(!imp.past&&!imp.present&&!imp.future)html+='<tr><td colspan="2" style="color:var(--text3)">未提供变位数据</td></tr>';
    html+='</table>';
  }

  if(a.perfective){
    const perf=a.perfective;
    html+='<div class="conj-label" style="margin-top:12px"><b>完成体 (СВ)</b> — 结果、一次、完成'+(perf.infinitive?'<br>不定式: <b style="color:var(--blue)">'+escape(perf.infinitive)+'</b>':'')+'</div>';
    html+='<table class="conj-table">';
    if(perf.past)html+=`<tr><td class="pronoun">过去时</td><td>${perf.past.masc||'—'} / ${perf.past.fem||'—'} / ${perf.past.neut||'—'} / ${perf.past.plur||'—'}</td></tr>`;
    html+='<tr><td class="pronoun">现在时</td><td style="color:var(--text3)">❌ 完成体没有现在时</td></tr>';
    if(perf.future)html+=`<tr><td class="pronoun">将来时</td><td>${perf.future['я']||'—'} / ${perf.future['ты']||'—'} / ${perf.future['он']||'—'} / ${perf.future['мы']||'—'} / ${perf.future['вы']||'—'} / ${perf.future['они']||'—'}</td></tr>`;
    if(perf.imperative)html+=`<tr><td class="pronoun">命令式</td><td>${perf.imperative.sg||'—'} / ${perf.imperative.pl||'—'}</td></tr>`;
    if(!perf.past&&!perf.future)html+='<tr><td colspan="2" style="color:var(--text3)">未提供变位数据</td></tr>';
    html+='</table>';
  }

  if(!a.imperfective&&!a.perfective){
    html+='<div style="color:var(--text3);font-size:13px;padding:4px 0">该词不是动词，没有体的变化</div>';
  }

  html+='</div>';
  return html;
}

// ═══ Render Tense Panel (时态变位) ═══
function renderTensePanel(analysis){
  if(!analysis)return'';
  const a=analysis.aspect;
  let html='<div class="conj-section"><div class="dict-section-title">⏳ 时态变位</div>';
  if(!a||!a.imperfective){
    html+='<div style="color:var(--text3);font-size:13px;padding:4px 0">该词不是动词，没有时态变化</div></div>';
    return html;
  }
  const imp=a.imperfective;
  const perf=a.perfective;

  // Past tense (by gender/number)
  if(imp.past){
    html+='<div class="conj-label"><b>过去时</b>（按性数变化，不分人称）</div>';
    html+='<table class="conj-table"><tr><th>阳性 (он)</th><th>阴性 (она)</th><th>中性 (оно)</th><th>复数 (они)</th></tr>';
    html+=`<tr><td>${imp.past.masc||'—'}</td><td>${imp.past.fem||'—'}</td><td>${imp.past.neut||'—'}</td><td>${imp.past.plur||'—'}</td></tr></table>`;
  }

  // Present tense (only imperfective has present)
  if(imp.present){
    html+='<div class="conj-label" style="margin-top:10px"><b>现在时</b>（仅未完成体有现在时）</div>';
    html+='<table class="conj-table"><tr><th>я</th><th>ты</th><th>он/она/оно</th><th>мы</th><th>вы</th><th>они</th></tr>';
    html+=`<tr><td>${imp.present['я']||'—'}</td><td>${imp.present['ты']||'—'}</td><td>${imp.present['он']||'—'}</td><td>${imp.present['мы']||'—'}</td><td>${imp.present['вы']||'—'}</td><td>${imp.present['они']||'—'}</td></tr></table>`;
  }

  // Future tense — imperfective (быть + infinitive)
  if(imp.future){
    html+='<div class="conj-label" style="margin-top:10px"><b>将来时 — 未完成体</b></div>';
    html+='<div style="font-size:11px;color:var(--text3);margin-bottom:4px">быть + 不定式（复合将来时）</div>';
    html+='<table class="conj-table"><tr><th>я</th><th>ты</th><th>он/она/оно</th><th>мы</th><th>вы</th><th>они</th></tr>';
    html+=`<tr><td>${imp.future['я']||'—'}</td><td>${imp.future['ты']||'—'}</td><td>${imp.future['он']||'—'}</td><td>${imp.future['мы']||'—'}</td><td>${imp.future['вы']||'—'}</td><td>${imp.future['они']||'—'}</td></tr></table>`;
  }

  // Future tense — perfective
  if(perf&&perf.future){
    html+='<div class="conj-label" style="margin-top:10px"><b>将来时 — 完成体</b></div>';
    html+='<div style="font-size:11px;color:var(--text3);margin-bottom:4px">完成体本身变位即表将来（简单将来时）</div>';
    const pf=perf.future;
    html+='<table class="conj-table"><tr><th>я</th><th>ты</th><th>он/она/оно</th><th>мы</th><th>вы</th><th>они</th></tr>';
    html+=`<tr><td>${pf['я']||'—'}</td><td>${pf['ты']||'—'}</td><td>${pf['он']||'—'}</td><td>${pf['мы']||'—'}</td><td>${pf['вы']||'—'}</td><td>${pf['они']||'—'}</td></tr></table>`;
  }

  if(!imp.past&&!imp.present&&!imp.future){
    html+='<div style="color:var(--text3);font-size:13px;padding:4px 0">未提供时态数据</div>';
  }

  html+='</div>';
  return html;
}

// ═══ Render Declension Panel (变格) ═══
function renderDeclensionPanel(analysis){
  if(!analysis||!analysis.declension)return'';
  const d=analysis.declension;
  const CASES=['nominative','genitive','dative','accusative','instrumental','prepositional'];
  const CN={nominative:'主格 (Им.)',genitive:'属格 (Род.)',dative:'与格 (Дат.)',accusative:'宾格 (Вин.)',instrumental:'工具格 (Твор.)',prepositional:'前置格 (Предл.)'};
  const hasData=CASES.some(c=>d[c]&&(d[c].sg||d[c].pl));
  if(!hasData)return'';
  let html='<div class="conj-section"><div class="dict-section-title">📐 变格</div>';
  html+='<table class="conj-table"><tr><th></th><th>单数</th><th>复数</th></tr>';
  CASES.forEach(c=>{
    if(d[c]&&(d[c].sg||d[c].pl)){
      html+=`<tr><td class="pronoun">${CN[c]}</td><td>${escape(d[c].sg||'—')}</td><td>${escape(d[c].pl||'—')}</td></tr>`;
    }
  });
  html+='</table></div>';
  return html;
}

// ═══ Render multi meanings ═══
function renderMultiMeanings(analysis){
  if(!analysis||!analysis.meanings||!analysis.meanings.length)return'';
  let html='<div class="multi-meanings"><div class="mm-title">📖 一词多译</div>';
  analysis.meanings.forEach(m=>{
    html+=`<span class="mm-item">${m.index}. ${escape(m.chinese)}</span>`;
  });
  html+='</div>';
  return html;
}

// ═══ doTranslate with word analysis ═══
async function doTranslate(){
  const t=$trInput.value.trim();
  if(!t){toast('请输入内容');return}
  if(S.settings.mode==='deep'&&!S.settings.dsKey){
    gotoKeySetup('深度翻译需要 API Key');return;
  }
  autoSrcLang(t);
  $trResult.innerHTML=loadingHTML();
  $btnTr.disabled=true;
  try{
    const r=S.settings.mode==='deep'?await translateDeepSeek(t):await translateFree(t,S.settings.model);
    if(!r){toast('结果为空');$trResult.innerHTML='';return}
    S.result=r;
    renderResult(r,t);
    addHistory(t,r.text);
    $btnSpeak.disabled=false;
  }catch(e){
    $trResult.innerHTML=`<div class="tr-result"><div class="tr-text" style="color:var(--text3)">翻译失败: ${escape(friendlyErr(e))}</div></div>`;
    toast('翻译失败')
  }finally{$btnTr.disabled=false}
}

function renderResult(r,src){
  const isFav=S.favs.some(f=>favMatch(f,src));
  // Show analysis when either source or target is a single Russian word（容忍标点：如"читать。"）
  const ruWord=(S.langSrc==='ru'&&cleanRussianWord(src))||(S.langTgt==='ru'&&cleanRussianWord(r.text))||null;
  const showAnalysis=!!ruWord;
  $trResult.innerHTML=`<div class="tr-result"><div class="tr-source">${LANGS[S.langSrc]}: ${escape(src)}</div><div class="tr-text">${escape(r.text)}</div>${r.det?`<div class="tr-phonetic">${r.det}</div>`:''}<button class="tr-save" id="saveWordBtn">${isFav?'★ 已收藏':'☆ 收藏'}</button><button class="tr-copy" id="copyBtn">📋 复制</button>${showAnalysis?`<div class="tr-analysis-btns"><button class="tr-analysis-btn" id="btnAspect">🔄 完成体 / 未完成体</button><button class="tr-analysis-btn" id="btnTense">⏳ 时态变位</button></div><div id="analysisPanels"></div>`:''}${!showAnalysis?`<div class="tr-analysis-btns"><button class="tr-analysis-btn" id="btnSent">📐 句子解析</button></div><div id="sentPanel"></div>`:''}</div>`;
  document.getElementById('saveWordBtn').addEventListener('click',()=>{toggleFav(src,r.text)});
  document.getElementById('copyBtn').addEventListener('click',()=>{navigator.clipboard.writeText(r.text).then(()=>{const b=document.getElementById('copyBtn');b.textContent='✓ 已复制';b.classList.add('copied');setTimeout(()=>{b.textContent='📋 复制';b.classList.remove('copied')},1500)}).catch(()=>toast('复制失败'))});
  // Analysis buttons — use ruWord (the Russian word to analyze)
  if(showAnalysis){
    const word=ruWord;
    let _a=null;
    const ensure=async()=>{
      if(_a)return _a;
      if(!S.settings.dsKey){gotoKeySetup('查看变位需要 API Key');return null}
      document.getElementById('analysisPanels').innerHTML=loadingHTML('正在分析变位…首次可能需要 30~60 秒');
      _a=await fetchWordAnalysis(word);
      if(_a._error){document.getElementById('analysisPanels').innerHTML='<div style="color:var(--red);font-size:13px;padding:8px">❌ '+escape(friendlyErr(_a._error))+'</div>';return null}
      if(!_a||!_a.aspect){document.getElementById('analysisPanels').innerHTML='<div style="color:var(--text3);font-size:13px;padding:8px">该词暂无变位数据</div>';return null}
      return _a;
    };
    document.getElementById('btnAspect').addEventListener('click',async()=>{
      document.getElementById('btnAspect').style.background='var(--blue-bg)';document.getElementById('btnTense').style.background='';
      const a=await ensure();if(!a)return;
      const tag=a._model?`<div style="font-size:11px;color:var(--text3);margin:8px 0 2px;text-align:right">🤖 ${escape(a._model)}</div>`:'';
      document.getElementById('analysisPanels').innerHTML=tag+(a.meanings?renderMultiMeanings(a):'')+renderAspectPanel(a)+renderDeclensionPanel(a);
    });
    document.getElementById('btnTense').addEventListener('click',async()=>{
      document.getElementById('btnTense').style.background='var(--blue-bg)';document.getElementById('btnAspect').style.background='';
      const a=await ensure();if(!a)return;
      const tag=a._model?`<div style="font-size:11px;color:var(--text3);margin:8px 0 2px;text-align:right">🤖 ${escape(a._model)}</div>`:'';
      document.getElementById('analysisPanels').innerHTML=tag+(a.meanings?renderMultiMeanings(a):'')+renderTensePanel(a)+renderDeclensionPanel(a);
    });
  }
  if(!showAnalysis){
    document.getElementById('btnSent').addEventListener('click',async()=>{
      document.getElementById('btnSent').style.background='var(--blue-bg)';
      const el=document.getElementById('sentPanel');
      if(!S.settings.dsKey){gotoKeySetup('句子解析需要接入码');return}
      const analText=S.langSrc!=='zh-CN'?src:r.text, analLang=S.langSrc!=='zh-CN'?S.langSrc:S.langTgt;
      el.innerHTML=loadingHTML('正在解析句子…约需 10~30 秒');
      const d=await fetchSentAnalysis(analText,analLang);
      if(d._error){el.innerHTML='<div style="color:var(--red);font-size:13px;padding:8px">❌ '+escape(friendlyErr(d._error))+'</div>';return}
      el.innerHTML=(d._model?`<div style="font-size:11px;color:var(--text3);margin:8px 0 2px;text-align:right">🤖 ${escape(d._model)}</div>`:'')+renderSentAnalysisHTML(d);
    });
  }
}

function toggleFav(orig,trans,el){const idx=S.favs.findIndex(f=>favMatch(f,orig));const label=S.langSrc==='ru'?'ru':S.langSrc==='en'?'en':'cn';if(idx>=0){S.favs.splice(idx,1);save('favs');renderFavs()}else{const e={time:Date.now()};e[label]=orig;e.trans=trans;e.lang=S.langSrc;S.favs.unshift(e);save('favs');renderFavs()}const nowFav=S.favs.some(f=>favMatch(f,orig));const btn=document.getElementById('saveWordBtn');if(btn){btn.textContent=nowFav?'★ 已收藏':'☆ 收藏'}if(el){el.textContent=nowFav?'★':'☆';el.classList.toggle('saved',nowFav)}}
function renderFavs(){const el=document.getElementById('favList');document.getElementById('favStats').innerHTML=`已收藏 <strong>${S.favs.length}</strong> 个单词`;if(!S.favs.length){el.innerHTML='<div class="empty-state">还没有收藏的单词</div>';return}el.innerHTML=S.favs.map((f,i)=>{const w=f.ru||f.en||f.cn||'';const t=f.trans||'';return`<div class="fav-item"><span class="fv-ru">${escape(w)}</span><span class="fv-cn">${escape(t)}</span><button class="fv-act" data-i="${i}">&#9654;</button><button class="fv-act" data-i="${i}" data-del="1">&#10005;</button></div>`}).join('');el.querySelectorAll('.fv-act[data-del]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();S.favs.splice(parseInt(b.dataset.i),1);save('favs');renderFavs()}));el.querySelectorAll('.fv-act:not([data-del])').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const f=S.favs[parseInt(b.dataset.i)];if(f)speak(f.ru||f.en||f.cn||'',f.lang||'ru',S.settings.speed)}))}

// 收藏导出/导入（JSON 文件，换设备或备份用）
function favExport(){
  if(!S.favs.length){toast('没有收藏可导出');return}
  const blob=new Blob([JSON.stringify(S.favs,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='俄语收藏_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('已导出 '+S.favs.length+' 条收藏')
}
function favImport(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const arr=JSON.parse(r.result);
        if(!Array.isArray(arr))throw new Error('bad');
        const seen=new Set();
        S.favs.forEach(f=>{if(f.ru)seen.add(f.ru);if(f.cn)seen.add(f.cn);if(f.en)seen.add(f.en)});
        let added=0;
        arr.forEach(x=>{if((x.ru&&seen.has(x.ru))||(x.cn&&seen.has(x.cn))||(x.en&&seen.has(x.en)))return;S.favs.push(x);added++;if(x.ru)seen.add(x.ru);if(x.cn)seen.add(x.cn);if(x.en)seen.add(x.en)});
        save('favs');renderFavs();
        toast('导入完成: 新增 '+added+' 条')
      }catch(e){toast('导入失败: 文件格式不正确')}
    };
    r.readAsText(f)
  };
  inp.click()
}
document.getElementById('favExport').addEventListener('click',favExport);
document.getElementById('favImport').addEventListener('click',favImport);

const $dictInput=document.getElementById('dictInput'),$dictResult=document.getElementById('dictResult');

async function doDictSearch(){
  const word=$dictInput.value.trim();
  if(!word){toast('请输入单词');return}
  if(!S.settings.dsKey){gotoKeySetup('字典查询需要 API Key');return}
  $dictResult.innerHTML=loadingHTML('正在查询词典…首次查询可能需要 30~60 秒');
  try{
    const d=await apiFetch('/api/dictionary',{body:{key:S.settings.dsKey,word,lang:/^[a-zA-Z][a-zA-Z '\-]*$/.test(word)?'en':'ru'},timeout:60000});
    renderDictResult(d);
  }catch(e){
    $dictResult.innerHTML=`<div class="dict-card"><div class="tr-text" style="color:var(--text3)">查询失败: ${escape(friendlyErr(e))}</div></div>`;
    toast('字典查询失败')
  }
}

function renderDictResult(d){
  if(d.raw){
    // JSON parse failed, show raw
    $dictResult.innerHTML=`<div class="dict-card"><div class="dict-word">${escape(d.raw.split('\n')[0]||'')}</div><div class="grammar-mini">${escape(d.raw)}</div></div>`;
    return;
  }
  let html='<div class="dict-card">';
  html+=`<div class="dict-word">${escape(d.word||'')}<span class="stress">${escape(d.stress||'')}</span></div>`;
  html+=`<div class="dict-pos">${escape(d.pos||'')}${d.gender?' · '+escape(d.gender)+'性':''}${d.animacy?' · '+escape(d.animacy):''}</div>`;

  // Meanings
  if(d.meanings&&d.meanings.length){
    html+='<div class="dict-section"><div class="dict-section-title">释义</div>';
    d.meanings.forEach(m=>{
      html+=`<div class="dict-meaning"><span class="dm-num">${m.index}</span>`;
      html+=`<span class="dm-cn">${escape(m.chinese||'')}</span>`;
      if(m.register&&m.register!=='通用')html+=`<span class="dm-reg">${escape(m.register)}</span>`;
      if(m.explanation)html+=`<div class="dm-exp">${escape(m.explanation)}</div>`;
      if(m.example){html+=`<div class="dm-ex">${escape(m.example.ru||'')}</div><div class="dm-ex-cn">${escape(m.example.cn||'')}</div>`}
      html+='</div>'
    });
    html+='</div>'
  }

  // Declension
  if(d.declension){
    html+='<div class="dict-section"><div class="dict-section-title">变格</div>';
    html+=`<div class="grammar-mini">${escape(d.declension)}</div></div>`
  }

  // Conjugation
  if(d.conjugation){
    html+='<div class="dict-section"><div class="dict-section-title">变位</div>';
    html+=`<div class="grammar-mini">${escape(d.conjugation)}</div></div>`
  }

  // Aspect pair
  if(d.aspect_pair){
    html+='<div class="dict-section"><div class="dict-section-title">体的对应</div>';
    html+=`<div class="grammar-mini">未完成体: <b>${escape(d.aspect_pair.imperfective||'')}</b><br>完成体: <b>${escape(d.aspect_pair.perfective||'')}</b></div></div>`
  }

  // Collocations
  if(d.collocations&&d.collocations.length){
    html+='<div class="dict-section"><div class="dict-section-title">常用搭配</div><ul class="dict-list">';
    d.collocations.forEach(c=>{html+=`<li>${escape(c)}</li>`});
    html+='</ul></div>'
  }

  // Derivatives
  if(d.derivatives&&d.derivatives.length){
    html+='<div class="dict-section"><div class="dict-section-title">派生词</div><div class="dict-tags">';
    d.derivatives.forEach(w=>{html+=`<span class="dict-tag">${escape(w)}</span>`});
    html+='</div></div>'
  }

  // Synonyms
  if(d.synonyms&&d.synonyms.length){
    html+='<div class="dict-section"><div class="dict-section-title">近义词</div><div class="dict-tags">';
    d.synonyms.forEach(s=>{html+=`<span class="dict-tag">${escape(s)}</span>`});
    html+='</div></div>'
  }

  // Usage note
  if(d.usage_note){
    html+='<div class="dict-section"><div class="dict-section-title">用法提示</div>';
    html+=`<div class="grammar-mini">${escape(d.usage_note)}</div></div>`
  }

  html+='</div>';
  $dictResult.innerHTML=html;
}

document.getElementById('btnDictSearch').addEventListener('click',doDictSearch);

let curBook=ls('lastBook',1),curLearnTab='book',curLesTab=0;

function renderLearn(){
  const el=document.getElementById('learnContent');
  // tab 高亮同步归 renderLearn 管，程序化切换不会出现"内容变了高亮没动"
  document.querySelectorAll('#learnTabs .sub-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===curLearnTab));
  if(curLearnTab==='book')renderBook(el);
  else if(curLearnTab==='major')renderMajor(el);
  else if(curLearnTab==='cefr')renderCefr(el);
  else renderLearnSettings(el);
}

function renderBook(el){
  const q=(document.getElementById('tbSearch')?document.getElementById('tbSearch').value:'').toLowerCase().trim();
  curBook=pzFixBook(curBook,pzLang());
  const V=pzLang()==='en'?VOCAB_EN:VOCAB;let lessons=V[curBook]||[];const progLesson=ls('prog',{})[curBook];
  if(q){lessons=lessons.map(l=>{const w=l.words.filter(w=>w.ru.toLowerCase().includes(q)||w.cn.includes(q));return w.length?{...l,words:w}:null}).filter(Boolean);if(!lessons.length){el.innerHTML='<div class="empty-state">没有匹配的单词</div>';return}}
  el.innerHTML=`
    ${S.settings.targetLevel?`<div style="font-size:11px;color:var(--text3);margin-bottom:6px">🎯 备考目标: <b style="color:var(--blue)">${S.settings.targetLevel}</b>（在 学习 → 设置 中修改）</div>`:''}
    <div class="book-bar">${(pzLang()==='en'?BOOKS_EN:BOOKS.filter(b=>b.id<=4)).map(b=>`<button class="book-chip${b.id===curBook?' active':''}" data-bid="${b.id}">${b.title}</button>`).join('')}</div>
    <div class="search-box"><span class="sicon">🔍</span><input type="text" id="tbSearch" placeholder="搜索单词..." value="${escape(q)}"></div>
    <div class="les-scroll">${lessons.map((l,i)=>`
      <div class="les-card${(q?(i===0):(progLesson?l.lesson===progLesson:i===0))?' open':''}">
        <div class="les-card-hdr" onclick="this.closest('.les-card').classList.toggle('open')">
          <div><div class="les-num">Урок ${l.lesson}${l.lesson===progLesson?' <span style="color:var(--blue)">🎯</span>':''}</div><div class="les-title">${l.title}</div></div>
          <span class="les-arrow">&#9660;</span>
        </div>
        <div class="les-card-body">
          <div class="les-tabs">
            <button class="les-tab active" onclick="switchLesTab(this,0,'${l.lesson}')">单词</button>
            <button class="les-tab" onclick="switchLesTab(this,1,'${l.lesson}')">语法</button>
            <button class="les-tab" onclick="switchLesTab(this,2,'${l.lesson}')">测试</button>
          </div>
          <div class="les-tab-content" id="lesTab_${l.lesson}_0">
            <div class="vocab-grid"><div class="grid-hdr">${pzLang()==='en'?'英语':'俄语'}</div><div class="grid-hdr">中文</div><div class="grid-hdr"></div>
            ${l.words.map(w=>`<div class="vg-ru"><span class="vg-act" onclick="event.stopPropagation();speakText('${jsStr(w.ru)}','${pzLang()==='en'?'en':'ru'}')">&#9654;</span> ${w.ru}</div><div class="vg-cn">${w.cn}</div><span class="vg-act${isFavWord(w)?' saved':''}" onclick="event.stopPropagation();toggleFav('${jsStr(w.ru)}','${jsStr(w.cn)}',this)">${isFavWord(w)?'★':'☆'}</span>`).join('')}
            </div>
          </div>
          <div class="les-tab-content" id="lesTab_${l.lesson}_1" style="display:none">
            <div class="grammar-mini">${l.grammar||'暂无语法内容'}</div>
          </div>
          <div class="les-tab-content" id="lesTab_${l.lesson}_2" style="display:none">
            ${l.quiz?`<div class="quiz-mini" id="quiz_${l.lesson}">${renderLesQuiz(l.quiz,l.lesson)}</div>`:'<div class="grammar-mini">暂无测验</div>'}
          </div>
        </div>
      </div>`).join('')}</div>`;
  el.querySelectorAll('.book-chip').forEach(b=>b.addEventListener('click',()=>{curBook=parseInt(b.dataset.bid);ss('lastBook',curBook);renderLearn();const oc=el.querySelector('.les-card.open');if(oc)setTimeout(()=>oc.scrollIntoView({block:'start',behavior:'smooth'}),80)}));
  let _tbDeb;el.querySelector('#tbSearch')?.addEventListener('input',()=>{clearTimeout(_tbDeb);_tbDeb=setTimeout(renderLearn,350)});
}
function switchLesTab(btn,idx,lid){
  const card=btn.closest('.les-card-body');
  card.querySelectorAll('.les-tab').forEach(t=>t.classList.remove('active'));btn.classList.add('active');
  for(let i=0;i<3;i++){const t=card.querySelector(`#lesTab_${lid}_${i}`);if(t)t.style.display=i===idx?'block':'none'}
}
function renderLesQuiz(quiz,lid){
  return quiz.map((q,qi)=>`<div style="margin-bottom:12px"><div class="qm-q">${qi+1}. ${q.q}</div>${q.opts.map((o,oi)=>`<button class="qm-opt" onclick="answerLesQuiz(this,${oi},${q.ans},${lid},${qi})">${o}</button>`).join('')}<div class="qm-result" id="qr_${lid}_${qi}"></div></div>`).join('')
}
window.answerLesQuiz=function(btn,chosen,ans,quizId,qi){
  const btns=btn.parentElement.querySelectorAll('.qm-opt');
  btns.forEach(b=>b.disabled=true);
  btns[ans].classList.add('correct');
  const res=document.getElementById(`qr_${quizId}_${qi}`);if(!res)return;
  if(chosen===ans){res.textContent='✓ 正确！';res.style.color='var(--green)';}else{btns[chosen].classList.add('wrong');res.textContent='✗ 错误，正确答案已标出';res.style.color='var(--red)';}
  res.style.display='block';
};
window.speakText=(t,l)=>speak(t,l,S.settings.speed);
window.toggleFav=toggleFav;

function renderMajor(el){
  const C=pzLang()==='en'?CS_ENGLISH:CS_RUSSIAN;
  const hd=pzLang()==='en'?'英语':'俄语';
  const sp=pzLang()==='en'?'en':'ru';
  let html=`<div style="font-weight:600;font-size:16px;margin-bottom:4px;color:var(--blue)">${C.title}</div><div style="font-size:var(--fs-sm);color:var(--text3);margin-bottom:12px">${C.desc}</div>`;
  C.sections.forEach(s=>{
    if(s.words){
      html+=`<div class="les-card open"><div class="les-card-hdr" onclick="this.closest('.les-card').classList.toggle('open')"><div><div class="les-num">${s.title}</div></div><span class="les-arrow">&#9660;</span></div><div class="les-card-body"><div class="vocab-grid"><div class="grid-hdr">${hd}</div><div class="grid-hdr">中文</div><div class="grid-hdr"></div>`;
      s.words.forEach(w=>{html+=`<div class="vg-ru"><span class="vg-act" onclick="event.stopPropagation();speakText('${jsStr(w.ru)}','${sp}')">&#9654;</span> ${w.ru}</div><div class="vg-cn">${w.cn}</div><span class="vg-act${isFavWord(w)?' saved':''}" onclick="event.stopPropagation();toggleFav('${jsStr(w.ru)}','${jsStr(w.cn)}',this)">${isFavWord(w)?'★':'☆'}</span>`});
      html+='</div></div></div>';
    }
    if(s.grammar){html+=`<div class="les-card open"><div class="les-card-hdr" onclick="this.closest('.les-card').classList.toggle('open')"><div><div class="les-num">${s.title}</div></div><span class="les-arrow">&#9660;</span></div><div class="les-card-body"><div class="grammar-mini">${s.grammar}</div></div></div>`}
  });
  el.innerHTML=html;
}

function renderCefr(el){
  const C=pzLang()==='en'?CEFR_EN:CEFR;
  let html=`<div style="font-weight:600;font-size:16px;margin-bottom:4px;color:var(--blue)">${C.title}</div><div class="level-desc">${C.desc}</div>`;
  C.levels.forEach(lv=>{
    html+=`<div class="level-card"><div class="lc-title">${lv.name}</div><div class="level-desc">${lv.desc}</div><button class="lc-btn" onclick="pzEnterExam('${lv.id}')">📝 进入考试</button></div>`;
  });
  el.innerHTML=html;
}
window.startCefrTest=function(lid,btn){
  const lv=CEFR.levels.find(l=>l.id===lid);
  if(!lv||!lv.test)return;
  const el=document.getElementById('cefrTest_'+lid);
  el.style.display='block';
  el.innerHTML=lv.test.map((q,qi)=>`<div style="margin-bottom:12px"><div class="qm-q">${qi+1}. ${q.q}</div>${q.opts.map((o,oi)=>`<button class="qm-opt" onclick="answerCefr(this,${oi},${q.ans},'${lid}',${qi})">${o}</button>`).join('')}<div class="qm-result" id="cr_${lid}_${qi}"></div></div>`).join('');
  btn.style.display='none';
};
window.answerCefr=function(btn,chosen,ans,cid,qi){
  const btns=btn.parentElement.querySelectorAll('.qm-opt');
  btns.forEach(b=>b.disabled=true);
  btns[ans].classList.add('correct');
  const res=document.getElementById(`cr_${cid}_${qi}`);if(!res)return;
  if(chosen===ans){res.textContent='✓ 正确！';res.style.color='var(--green)';}else{btns[chosen].classList.add('wrong');res.textContent='✗ 错误';res.style.color='var(--red)';}
  res.style.display='block';
};

let quizState={};
function renderQuizSetup(){const el=document.getElementById('quizArea');let ql=ls('qzlang',pzLang());let selected=new Set([String(ql==='en'?ls('lastBookEn',101):ls('lastBook',1))]);let onlyLearned=true;el.innerHTML=`<div class="anim-in" style="text-align:center;padding:24px 0"><div style="font-size:16px;font-weight:500;margin-bottom:4px">单词测验</div><div style="font-size:var(--fs-sm);color:var(--text3);margin-bottom:12px">选择测验语言</div><div class="book-bar" style="justify-content:center;margin-bottom:6px" id="qzLangBar">${[['ru','🇷🇺 俄语单词'],['en','🇬🇧 英语单词']].map(([k,t])=>`<button class="book-chip${ql===k?' active':''}" data-ql="${k}">${t}</button>`).join('')}</div><div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0">${(ql==='en'?BOOKS_EN:BOOKS).map(b=>`<button class="book-chip selected" data-b="${b.id}">${b.title}</button>`).join('')}</div><div id="qzScope" style="display:flex;gap:6px;justify-content:center;margin:4px 0"><button class="book-chip active" data-scope="learned">📖 只测已学课程</button><button class="book-chip" data-scope="all">📚 整本书</button></div><div id="qzHint" style="font-size:11px;color:var(--text3);min-height:14px;margin-top:2px"></div><div style="font-size:var(--fs-sm);color:var(--text2);margin:8px 0">已选 <strong id="qzTotal">0</strong> 个单词</div><button class="lc-btn" id="qzStart" style="font-size:var(--fs)">开始测验</button></div>`;const collect=()=>{const progNow=ls('prog',{});const V=ql==='en'?VOCAB_EN:VOCAB;const words=[];selected.forEach(bid=>{const bidN=parseInt(bid);if(bidN===5){bookWords(5).forEach(w=>words.push(w));return}const p=progNow[bidN];(V[bidN]||[]).forEach(l=>{if(!onlyLearned||!p||l.lesson<=p)l.words.forEach(w=>words.push({...w,book:bidN}))})});return words};function updateTotal(){const words=collect();document.getElementById('qzTotal').textContent=words.length;const progNow=ls('prog',{});const miss=[...selected].map(Number).filter(b=>b!==5&&!progNow[b]);document.getElementById('qzHint').textContent=(onlyLearned&&miss.length)?('💡 '+miss.map(b=>((ql==='en'?BOOKS_EN:BOOKS).find(x=>x.id===b)||{}).title).join('、')+' 未设置学习进度，暂按整本书出题（学习 → 设置 可标记）'):''}updateTotal();el.querySelectorAll('.book-chip').forEach(b=>{if(!selected.has(b.dataset.b))b.classList.remove('selected')});el.querySelectorAll('.book-chip[data-b]').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.b;b.classList.toggle('selected');if(b.classList.contains('selected'))selected.add(id);else selected.delete(id);if(!selected.size){selected.add(id);b.classList.add('selected')}updateTotal();updateScopeUI()}));el.querySelectorAll('#qzScope .book-chip').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.scope==='learned'){updateScopeUI();if(![...selected].some(x=>parseInt(x)!==5&&ls('prog',{})[parseInt(x)])){toast('先在 学习 → 设置 里标记「学到第几课」才能只测已学');return}}el.querySelectorAll('#qzScope .book-chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');onlyLearned=b.dataset.scope==='learned';updateTotal()}));el.querySelectorAll('#qzLangBar .book-chip').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.ql!==ql){ss('qzlang',b.dataset.ql);renderQuizSetup()}}));const updateScopeUI=()=>{const lc=el.querySelector('#qzScope .book-chip[data-scope="learned"]');if(!lc)return;const enabled=[...selected].some(x=>parseInt(x)!==5&&ls('prog',{})[parseInt(x)]);if(!enabled&&onlyLearned){onlyLearned=false;el.querySelectorAll('#qzScope .book-chip').forEach(x=>x.classList.remove('active'));el.querySelector('#qzScope .book-chip[data-scope="all"]').classList.add('active');updateTotal()}lc.style.opacity=enabled?'':'0.4';lc.style.cursor=enabled?'pointer':'not-allowed'};updateScopeUI();document.getElementById('qzStart').addEventListener('click',()=>{const words=collect();if(words.length<4){toast('单词太少（至少4个）');return}shuffle(words);quizState={words,idx:0,correct:0,wrong:[]};renderQuizQ()})}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function renderQuizQ(){const qs=quizState;if(qs.idx>=qs.words.length){renderQuizResult();return}const w=qs.words[qs.idx];let opts=[w.cn];const pool=qs.words.filter(x=>x.cn!==w.cn);shuffle(pool);for(let i=0;i<3&&i<pool.length;i++)opts.push(pool[i].cn);if(opts.length<4){const all=Object.values(VOCAB).flatMap(l=>l.flatMap(ls=>ls.words)).filter(x=>!opts.includes(x.cn));shuffle(all);for(let i=0;opts.length<4&&i<all.length;i++)if(!opts.includes(all[i].cn))opts.push(all[i].cn)}shuffle(opts);const el=document.getElementById('quizArea');el.innerHTML=`<div class="anim-in" style="padding:24px 16px;text-align:center"><div style="text-align:left;margin-bottom:8px"><span style="cursor:pointer;font-size:18px;color:var(--blue);padding:4px 8px;line-height:1" onclick="if(confirm('确定退出测验？'))renderQuizSetup()">← 返回</span></div><div style="font-size:var(--fs-sm);color:var(--text3);margin-bottom:10px">${qs.idx+1}/${qs.words.length}</div><div style="height:3px;border-radius:2px;background:var(--border);margin-bottom:20px;overflow:hidden"><div style="height:100%;border-radius:2px;background:var(--blue);transition:width .3s;width:${(qs.idx/qs.words.length*100)}%"></div></div><div style="font-size:28px;font-weight:500;color:var(--blue);margin-bottom:16px;line-height:1.4">${w.ru}</div><div style="display:grid;gap:8px" id="qOpts">${opts.map(o=>`<button style="padding:14px 16px;border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:var(--fs);text-align:left;border:1.5px solid var(--border)" data-v="${o}">${o}</button>`).join('')}</div></div>`;let answered=false;el.querySelectorAll('#qOpts button').forEach(btn=>{btn.addEventListener('click',()=>{if(answered)return;answered=true;const val=btn.textContent;const isCorrect=val===w.cn;if(isCorrect){qs.correct++;btn.style.borderColor='var(--green)';btn.style.color='var(--green)';btn.style.background='rgba(34,197,94,.08)'}else{btn.style.borderColor='var(--red)';btn.style.color='var(--red)';qs.wrong.push(w);el.querySelector(`#qOpts button[data-v="${escape(w.cn)}"]`).style.borderColor='var(--blue)';el.querySelector(`#qOpts button[data-v="${escape(w.cn)}"]`).style.color='var(--blue)'}const nb=document.createElement('button');nb.style.cssText='margin-top:16px;padding:11px 28px;border-radius:20px;background:var(--blue);color:#fff;font-weight:600;font-size:var(--fs-sm);border:none;cursor:pointer';nb.textContent=qs.idx+1>=qs.words.length?'查看结果':'下一题';nb.addEventListener('click',()=>{qs.idx++;renderQuizQ()});el.querySelector('.anim-in').appendChild(nb)})})}
function renderQuizResult(){const qs=quizState;if(qs.wrong.length){const pool=qs.words.map(w=>w.cn);qs.wrong.forEach(w=>{const opts=[w.cn];const others=shuffle(pool.filter(x=>x!==w.cn));for(let i=0;i<3&&i<others.length;i++)opts.push(others[i]);const m=opts.map((t,i)=>({t,ok:i===0}));shuffle(m);pzAddWrong({_id:'wq_'+w.ru,level:'课本',tag:'词汇',q:'«'+w.ru+'» 的意思是？',opts:m.map(x=>x.t),ans:m.findIndex(x=>x.ok),explain:w.ru+' = '+w.cn,w:w.ru},null)})}const pct=Math.round(qs.correct/qs.words.length*100);document.getElementById('quizArea').innerHTML=`<div class="anim-in" style="text-align:center;padding:32px 16px"><div style="font-size:48px;font-weight:300;color:var(--blue);margin-bottom:4px">${qs.correct}/${qs.words.length}</div><div style="font-size:var(--fs-sm);color:var(--text2);margin-bottom:4px">正确率 ${pct}%</div>${qs.wrong.length?'<div style="font-size:11px;color:var(--text3);margin-bottom:14px">错词已收入错题本（练习中心 → 错题重做）</div>':'<div style="height:14px"></div>'}<div style="font-size:var(--fs-sm);color:var(--text3);margin-bottom:20px;line-height:1.8">${qs.wrong.length?`需要复习（点击单词直接跳转学习）：<br>${qs.wrong.map(w=>`<span style="color:var(--blue);text-decoration:underline;cursor:pointer" onclick="learnShowWord('${jsStr(w.ru)}',${w.book||0})">${w.ru}</span>(${w.cn})`).join('、')}`:'全部正确！'}</div><button style="padding:11px 24px;border-radius:20px;font-size:var(--fs-sm);background:var(--surface);color:var(--text2);border:1.5px solid var(--border);margin:4px;cursor:pointer" onclick="renderQuizSetup()">再来一次</button><button style="padding:11px 24px;border-radius:20px;font-size:var(--fs-sm);background:var(--surface);color:var(--text2);border:1.5px solid var(--border);margin:4px;cursor:pointer" onclick="document.querySelector('.nav-btn[data-screen=sLearn]').click()">去复习</button></div>`}
// 错词点击 → 跳到学习页对应位置并搜索该词（专业俄语词跳专业 tab）
function learnShowWord(word,bid){

}

// ── PZ 工具 ──
const pzToday=()=>new Date().toLocaleDateString('sv');
const pzL=i=>String.fromCharCode(1040+i);
const pzFmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function pzFlat(level){
  const bank=pzLang()==='en'?PZ_BANK_EN:PZ_BANK, extra=pzLang()==='en'?PZ_EXTRA_EN:PZ_EXTRA;
  const items=[{arr:bank[level]||[],suf:''},{arr:extra[level]||[],suf:'x'},{arr:(pzLang()==='en'?(PZ_LISTEN_EN[level]||[]):(PZ_LISTEN_RU[level]||[])),suf:'l'}].flatMap(src=>src.arr.map((it,ii)=>({it,ii,suf:src.suf})));
  const out=[];
  items.forEach(({it,ii,suf})=>{
    if(it.type==='reading'){it.qs.forEach((q,qi)=>out.push({_id:level+suf+'-r'+ii+'-'+qi,tag:'阅读',level,lang:pzLang(),passage:it.passage,q:q.q,opts:q.opts,ans:q.ans,explain:q.explain}))}
    else if(it.type==='listening'){out.push({_id:level+suf+'-l'+ii,tag:'听力',level,lang:pzLang(),audio:it.audio,q:it.q,opts:it.opts,ans:it.ans,explain:it.explain})}
    else if(it.type==='pairing'){
      const cns=it.words.map(w=>w.cn);
      it.words.forEach((w,wi)=>out.push({_id:level+suf+'-p'+ii+'-'+wi,tag:'配对',level,lang:pzLang(),q:'«'+w.ru+'» 的意思是？',opts:cns.slice(),ans:cns.indexOf(w.cn),explain:'词义：'+w.ru+' = '+w.cn,w:w.ru}));
    }else{
      const tag=it.type==='grammar'?'语法':it.type==='vocab'?'词汇':'情景';
      out.push({_id:level+suf+'-'+it.type[0]+ii,tag,level,lang:pzLang(),focus:it.focus,q:it.q,opts:it.opts,ans:it.ans,explain:it.explain,w:it.w});
    }
  });
  out.forEach(c=>{const m=c.opts.map((t,i)=>({t,ok:i===c.ans}));shuffle(m);c.opts=m.map(x=>x.t);c.ans=m.findIndex(x=>x.ok)});
  return out;
}

function pzBackupExport(){
  const data={app:'russian-app',exportedAt:new Date().toISOString(),
    favs:S.favs,history:S.history,prog:ls('prog',{}),pzWrong:ls('pzWrong',[]),pzStat:ls('pzStat',{total:0,correct:0,days:{}}),
    pzLevel:ls('pzLevel','A1'),pzPaperFav:ls('pzPaperFav',[]),lastBook:ls('lastBook',1),lastBookEn:ls('lastBookEn',101),
    settings:Object.assign({},S.settings,{dsKey:''})}; // 接入码不导出
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='russian-app-backup-'+pzToday().replace(/-/g,'')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('备份已导出（不含接入码）');
}
function pzBackupImport(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{
    const d=JSON.parse(rd.result);
    if(d.app!=='russian-app')throw new Error('不是本软件的备份文件');
    if(Array.isArray(d.favs)){S.favs=d.favs;save('favs')}
    if(Array.isArray(d.history)){S.history=d.history;save('history')}
    if(d.prog)ss('prog',d.prog);
    if(d.pzWrong)ss('pzWrong',d.pzWrong);
    if(d.pzStat)ss('pzStat',d.pzStat);
    if(d.pzLevel)ss('pzLevel',d.pzLevel);
    if(d.pzPaperFav)ss('pzPaperFav',d.pzPaperFav);
    if(d.lastBook)ss('lastBook',d.lastBook);
    if(d.lastBookEn)ss('lastBookEn',d.lastBookEn);
    if(d.settings){const keep=S.settings.dsKey;S.settings=Object.assign(S.settings,d.settings,{dsKey:keep});save('settings')}
    toast('备份已导入');renderLearn();
  }catch(e){toast('导入失败：'+e.message)}};
  rd.readAsText(f);
}

// ── 模式二：模拟测试（统一判分 + 倒计时）──
function pzCompose(lv){
  const flat=pzFlat(lv),by={};
  flat.forEach(c=>{(by[c.tag]=by[c.tag]||[]).push(c)});
  const want=Object.assign({语法:10,词汇:5,情景:4,阅读:3,听力:3,配对:3},pzLang()==='en'?{词汇:4}:{}),out=[];
  ['语法','词汇','情景','阅读','听力','配对'].forEach(t=>{
    const pool=shuffle((by[t]||[]).slice());
    let need=want[t];
    while(need>0&&pool.length){out.push(pool.pop());need--}
  });
  if(out.length<25){const rest=shuffle(flat.slice()).filter(c=>!out.includes(c));out.push(...rest.slice(0,25-out.length))}
  return out;
}
function pzStartMock(lv){
  const cards=pzCompose(lv);
  if(cards.length<5){toast('该级别题目不足');return}

}

// ── 等级考卷（每级3套主题试卷：试卷一动词/试卷二变格支配/试卷三综合）──
function pzComposePaper(level,paper){
  const flat=pzFlat(level),by={};
  flat.forEach(c=>{(by[c.tag]=by[c.tag]||[]).push(c)});
  const s=paper.sections,out=[],used=new Set();
  const take=(tag,total)=>{
    if(!total)return;
    const pool=(by[tag]||[]);
    const foc=paper.focus?pool.filter(c=>c.focus===paper.focus):[];
    const gen=pool.filter(c=>!foc.includes(c));
    shuffle(foc);shuffle(gen);
    const picked=foc.slice(0,Math.min(foc.length,Math.ceil(total*0.7)));
    picked.forEach(c=>used.add(c));
    const rest=gen.filter(c=>!used.has(c)).slice(0,Math.max(0,total-picked.length));
    rest.forEach(c=>used.add(c));
    out.push(...picked,...rest);
  };
  take('语法',s.grammar||0);take('词汇',s.vocab||0);take('情景',s.situational||0);take('阅读',s.reading||0);take('听力',s.listening||0);take('配对',s.pairing||0);
  if(out.length<20){const rest=shuffle(flat.slice()).filter(c=>!used.has(c)&&!out.includes(c));out.push(...rest.slice(0,20-out.length))}
  return out;
}
function pzStartPaper(level,paper){
  const cards=pzComposePaper(level,paper);
  if(cards.length<5){toast('该级别试卷题目不足');return}
  PZ={mode:'mock',level,paperId:paper.id,paperLabel:paper.label,paperName:paper.name,cards,idx:0,picks:Array(cards.length).fill(null),t0:Date.now(),left:paper.time*60,timerId:null};
  pzQMock();
  PZ.timerId=setInterval(()=>{
    PZ.left--;
    const c=document.getElementById('pzClock');
    if(c){c.textContent=pzFmt(PZ.left);c.style.color=PZ.left<120?'var(--red)':'var(--blue)'}
    if(PZ.left<=0){pzStopTimer();toast('时间到，自动交卷');pzMockSubmit()}
  },1000);
}

// ═══ IndexedDB 封装（零依赖，Promise 风格，异步不阻塞 UI）═══
window.idbStore=(function(){
  const DB='russian_app',VER=1;
  let _db=null;
  function open(){
    if(_db)return Promise.resolve(_db);
    return new Promise((res,rej)=>{
      const rq=indexedDB.open(DB,VER);
      rq.onupgradeneeded=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains('sessions'))db.createObjectStore('sessions',{keyPath:'id'});
        if(!db.objectStoreNames.contains('transcripts')){
          const st=db.createObjectStore('transcripts',{keyPath:'id'});
          st.createIndex('sessionId','sessionId',{unique:false});
        }
      };
      rq.onsuccess=()=>{_db=rq.result;res(_db)};
      rq.onerror=()=>rej(rq.error);
    });
  }
  function run(store,mode,fn){
    return open().then(db=>new Promise((res,rej)=>{
      const t=db.transaction(store,mode);
      const os=t.objectStore(store);
      let result;
      t.oncomplete=()=>res(result);
      t.onerror=()=>rej(t.error);
      t.onabort=()=>rej(t.error);
      let r;
      try{r=fn(os)}catch(e){rej(e);return}
      r.onsuccess=()=>{result=r.result};
      r.onerror=()=>rej(r.error);
    }));
  }
  return {
    put:(store,val)=>run(store,'readwrite',os=>os.put(val)),
    get:(store,key)=>run(store,'readonly',os=>os.get(key)),
    getAll:(store)=>run(store,'readonly',os=>os.getAll()),
    del:(store,key)=>run(store,'readwrite',os=>os.delete(key)),
    byIndex:(store,idx,key)=>run(store,'readonly',os=>os.index(idx).getAll(key)),
  };
})();
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function fmtTime(ts){const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function fmtTimeShort(ts){const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')}

function classEditItem(i){
  const it=CLASS.items[i];
  if(!it)return;
  const el=document.querySelector(`[data-edit="${i}"]`);
  if(!el)return;
  const ta=document.createElement('textarea');
  ta.value=it.original;
  ta.style.cssText='width:100%;min-height:64px;font-size:16px;font-weight:600;color:var(--text);background:var(--input);border:1.5px solid var(--blue);border-radius:8px;padding:8px;line-height:1.4;resize:vertical;font-family:inherit;box-sizing:border-box';
  el.replaceWith(ta);
  ta.focus();
  let done=false;
  const finish=async save=>{
    if(done)return;done=true;
    const newText=ta.value.trim();
    if(save&&newText&&newText!==it.original){
      ta.disabled=true;
      ta.style.opacity='.6';
      const r=await classTranslate(newText);
      it.original=r.original||newText;
      it.translation=r.translation||'';
      it.note=r.note||'';
      it.confidence=null; // 手动修正后清除低置信标记
      if(it._id&&CLASS.sessionId){
        idbStore.put('transcripts',{id:it._id,sessionId:CLASS.sessionId,timestamp:it._ts,original:it.original,translation:it.translation,note:it.note,confidence:null,star:it.star?1:0}).catch(()=>{});
      }
    }
    classRender();
  };
  ta.addEventListener('keydown',e=>{
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();finish(true)}
    else if(e.key==='Escape'){finish(false)}
  });
  ta.addEventListener('blur',()=>finish(false));
}

async function classTranslate(text){
  if(!S.settings.dsKey){return{original:text,translation:'（需要 DeepSeek Key 才能翻译，请在设置中填写）',note:''}}
  try{
    const d=await apiFetch('/api/class-translate',{body:{key:S.settings.dsKey,text,terms:classTermsGet().map(t=>t.ru+'='+t.cn).join('; ').slice(0,800)},timeout:35000});
    return{original:d.original||text,translation:d.translation||'',note:d.note||''};
  }catch(e){
    return{original:text,translation:'（翻译失败: '+friendlyErr(e)+'）',note:''};
  }
}

function classStart(){
  const status=document.getElementById('classStatus');
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    status.textContent='❌ 浏览器不支持';
    document.getElementById('classHint').innerHTML='请用 <b>Chrome 或 Edge</b> 打开本页面（本机 localhost 可直接用麦克风）';
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    classStream=stream;
    // 每次开始录音新建一个课堂会话，句子自动存入该会话
    CLASS.sessionId=genId();
    CLASS._sessionStart=Date.now();
    idbStore.put('sessions',{id:CLASS.sessionId,startTime:CLASS._sessionStart,endTime:null,courseName:''}).catch(()=>{});
    classAudioCtx=new (window.AudioContext||window.webkitAudioContext)();
    const srcNode=classAudioCtx.createMediaStreamSource(stream);
    classAnalyser=classAudioCtx.createAnalyser();
    classAnalyser.fftSize=1024;
    srcNode.connect(classAnalyser);
    classMime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';
    classRecorder=new MediaRecorder(stream,{mimeType:classMime});
    classChunks=[];
    classRecorder.ondataavailable=e=>{if(e.data&&e.data.size)classChunks.push(e.data)};
    classRecorder.onstop=()=>{
      if(classChunks.length){const blob=new Blob(classChunks,{type:classMime});classChunks=[];classRecognize(blob)}
      if(CLASS.running){try{classRecorder.start(200)}catch(e){}}
    };
    classRecorder.start(200);
    CLASS.running=true;classSilenceMs=0;
    document.getElementById('classStartBtn').disabled=true;
    document.getElementById('classStopBtn').disabled=false;
    status.textContent='🎙️ 聆听中…';
    document.getElementById('classHint').innerHTML='说俄语 → 自动识别 → 翻译显示';
    classSilenceTick();
  }).catch(()=>{
    status.textContent='❌ 麦克风被拒绝';
    document.getElementById('classHint').innerHTML='浏览器地址栏 🔒 → 网站设置 → 允许麦克风（手机需 HTTPS 或 localhost）';
  });
}

async function classRecognize(blob){
  try{
    const r=await fetch(API_BASE+'/api/voice',{method:'POST',body:blob,signal:AbortSignal.timeout(120000)});
    const d=await r.json().catch(()=>({}));
    if(d.error)throw new Error(d.error);
    classSendText(d.text||'', d.confidence);
  }catch(e){
    console.error('语音识别失败',e.message||e);
  }
}

async function classSendText(t,confidence){
  const tt=(t||'').trim();
  if(!tt||tt===CLASS._lastSent)return;
  CLASS._lastSent=tt;
  document.getElementById('classHint').innerHTML='<span style="color:var(--text2)">翻译中…</span>';
  classTranslate(tt).then(r=>{
    classAddItem(r.original,r.translation,r.note,confidence);
    document.getElementById('classHint').innerHTML='说俄语 → 自动识别 → 翻译显示';
  });
}

function classSilenceTick(){
  if(!CLASS.running)return;
  const buf=new Uint8Array(classAnalyser.fftSize);
  classAnalyser.getByteTimeDomainData(buf);
  let sum=0;
  for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v}
  const rms=Math.sqrt(sum/buf.length);
  if(rms<0.015){
    classSilenceMs+=200;
    if(classSilenceMs>=1200&&classRecorder&&classRecorder.state==='recording'){
      classSilenceMs=0;
      try{classRecorder.stop()}catch(e){} // onstop 里识别并自动重开
    }
  }else{
    classSilenceMs=0;
  }
  setTimeout(classSilenceTick,200);
}

function classStop(){
  CLASS.running=false;CLASS._lastSent='';classSilenceMs=0;
  // 结束会话：写入结束时间
  if(CLASS.sessionId){
    idbStore.put('sessions',{id:CLASS.sessionId,startTime:CLASS._sessionStart,endTime:Date.now(),courseName:''}).catch(()=>{});
    CLASS.sessionId=null;
    CLASS._sessionStart=null;
  }
  if(classRecorder){try{classRecorder.stop()}catch(e){}classRecorder=null}
  if(classStream){classStream.getTracks().forEach(t=>t.stop());classStream=null}
  if(classAudioCtx){try{classAudioCtx.close()}catch(e){}classAudioCtx=null}
  classAnalyser=null;
  document.getElementById('classStartBtn').disabled=false;
  document.getElementById('classStopBtn').disabled=true;
  document.getElementById('classStatus').textContent='已停止';
}

function classSave(){

  const text=classItemsToText(CLASS.items);

function classClear(){

// ═══ 课堂历史记录（IndexedDB，按会话回看） ═══
let classHistMode=false;
const CLASS_BACK_BTN='<button id="classBackLive" style="padding:7px 14px;border-radius:16px;font-size:12px;background:var(--surface);color:var(--text2);border:1.5px solid var(--border)">← 返回字幕板</button>';
function classItemsToText(items){return items.map((it,i)=>`${i+1}. [${it.time||fmtTimeShort(it.timestamp)}] ${it.original}\n    ${it.translation}${it.note?' ⚠️'+it.note:''}${it.confidence!==null&&it.confidence<-0.8?' ⚠️识别不准':''}`).join('\n\n')}
function classItemsToMarkdown(session,items){
  const stars=items.filter(x=>x.star);
  const head=['# 课堂记录','','- 日期：'+fmtTime(session.startTime),'- 时长：'+(session.endTime?Math.round((session.endTime-session.startTime)/1000)+' 秒':'进行中'),'- 句数：'+items.length,'- 重点句：'+stars.length,'','---',''];
  const starSec=stars.length?['## ⭐ 本课重点',''].concat(stars.map(x=>'- '+x.original+' — '+x.translation),['','---','']):[];
  const body=items.map((it,i)=>{
    let line='### '+(it.star?'⭐ ':'')+(i+1)+'. '+it.original;
    line+='\n\n> '+it.translation;
    if(it.note)line+='\n\n⚠️ '+it.note;
    if(it.confidence!==null&&it.confidence<-0.8)line+='\n\n⚠️ 识别不准';
    line+='\n\n<small>'+(it.time||fmtTimeShort(it.timestamp))+'</small>';
    return line;
  });
  return head.join('\n')+starSec.join('\n')+'\n'+body.join('\n\n');
}
function downloadMd(filename,content){
  const blob=new Blob(['﻿'+content],{type:'text/markdown;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
async function classHistData(){
  const sessions=await idbStore.getAll('sessions');
  const transcripts=await idbStore.getAll('transcripts');
  sessions.sort((a,b)=>(b.startTime||0)-(a.startTime||0));
  const byS={};
  transcripts.forEach(t=>{(byS[t.sessionId]=byS[t.sessionId]||[]).push(t)});
  Object.values(byS).forEach(arr=>arr.sort((a,b)=>(a.timestamp||0)-(b.timestamp||0)));
  return {sessions,byS};
}
function setClassHist(on){
  classHistMode=on;
  document.getElementById('classHistBtn').textContent=on?'← 字幕板':'📚 历史';
  if(on)classHistRender();else classRender();
}
async function classHistRender(){
  const el=document.getElementById('classBoard');
  const {sessions,byS}=await classHistData();
  const filled=sessions.filter(s=>(byS[s.id]||[]).length>0);
  if(!filled.length){
    el.innerHTML='<div style="padding:6px 0;flex-shrink:0">'+CLASS_BACK_BTN+'</div><div class="empty-state">还没有课堂记录<br>课堂模式里点「开始录音」，每句译文自动保存<br>点「💾」可复制当前字幕板</div>';

  filled.forEach(s=>{
    const items=byS[s.id]||[];
    const dur=s.endTime?Math.round((s.endTime-s.startTime)/1000)+' 秒':'进行中';
    html+=`<div class="les-card" style="margin-top:6px"><div class="les-card-hdr" onclick="this.closest('.les-card').classList.toggle('open')"><div><div class="les-num">📅 ${fmtTime(s.startTime)}</div><div class="les-title">${items.length} 句 · ${dur}</div></div><span style="display:flex;gap:6px;align-items:center"><button class="mini-chip" data-sid="${s.id}" data-act="copy">📋 复制</button><button class="mini-chip" data-sid="${s.id}" data-act="md">⬇️ 导出</button><button class="mini-chip danger" data-sid="${s.id}" data-act="del">🗑 删除</button><span class="les-arrow" style="margin-left:4px">&#9660;</span></span></div><div class="les-card-body">`+
    items.map((it,i)=>`<div style="padding:8px 4px;border-bottom:1px solid var(--border2);display:flex;gap:6px;align-items:flex-start"><span style="font-size:10px;color:var(--text3);white-space:nowrap;padding-top:3px">${it.time||fmtTimeShort(it.timestamp)}</span><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:500">${escape(it.original)}${it.confidence!==null&&it.confidence<-0.8?' <span style="color:var(--yellow);font-size:11px">⚠️</span>':''}</div><div style="font-size:12px;color:var(--blue)">${escape(it.translation)}</div>${it.note?`<div style="font-size:11px;color:var(--yellow)">⚠️ ${escape(it.note)}</div>`:''}</div><button class="mini-chip" data-sid="${s.id}" data-i="${i}" data-act="play">🔊</button></div>`).join('')+
    '</div></div>';
  });

// 事件委托：课堂历史里的 返回/播放/复制/导出/删除 一次绑定
document.getElementById('classBoard').addEventListener('click',async e=>{
  const t=e.target.closest('#classBackLive,.mini-chip');
  if(!t)return;
  if(t.id==='classBackLive'){setClassHist(false);return}
  const sid=t.dataset.sid,act=t.dataset.act;
  if(!sid)return;
  const {sessions,byS}=await classHistData();
  const session=sessions.find(s=>s.id===sid);
  const items=byS[sid]||[];
  if(act==='play'){const it=items[parseInt(t.dataset.i)];if(it)speak(it.original,'ru',.9)}
  else if(act==='copy'){navigator.clipboard.writeText(classItemsToText(items)).then(()=>toast('已复制')).catch(()=>toast('复制失败'))}
  else if(act==='md'){downloadMd('课堂记录_'+fmtTime(session.startTime).replace(/[: ]/g,'-')+'.md',classItemsToMarkdown(session,items));toast('已导出 Markdown')}
  else if(act==='del'){
    if(!confirm('删除这节课的全部记录？'))return;
    await idbStore.del('sessions',sid).catch(()=>{});
    await Promise.all(items.map(it=>idbStore.del('transcripts',it.id).catch(()=>{})));
    classHistRender();
  }
});

// ═══ 系统诊断 ═══
window.runDiagnose=async function(btn){
  const el=document.getElementById('diagResult');
  el.innerHTML='<div style="color:var(--text3)">检查中…</div>';
  btn.disabled=true;
  const lines=[];
  // 1. 代理可达 + 各服务状态
  try{
    const r=await fetch(`${API_BASE}/api/diagnose`,{signal:AbortSignal.timeout(15000)});
    if(r.ok){
      const d=await r.json();
      lines.push('🖥️ 代理服务器: '+(d.server==='ok'?'✅ 运行中':'⚠️ 异常'));
      d.checks.forEach(c=>lines.push((c.ok?'✅':'❌')+' '+c.name+': '+c.detail));
    }else{
      lines.push('❌ 代理响应异常: HTTP '+r.status);
    }
  }catch(e){
    lines.push('❌ 代理服务器不可达: '+escape(friendlyErr(e)));
    lines.push('   → 请确认电脑端已启动代理（俄语学习目录下运行 node proxy.js）');
  }
  // 2. DeepSeek Key
  if(S.settings.dsKey){
    lines.push('🔑 DeepSeek Key: 已配置 ('+S.settings.dsKey.slice(0,8)+'…)');
  }else{
    lines.push('⚠️ DeepSeek Key: 未配置（深度翻译/字典/变位需要）');
  }
  // 3. Service Worker
  if(navigator.serviceWorker){
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      lines.push(regs.length?('ℹ️ Service Worker: '+regs.length+' 个已注册（页面异常时去 /clear-cache.html 清理）'):'ℹ️ Service Worker: 未注册');
    }catch(e){}
  }
  el.innerHTML=lines.join('<br>')+'<br><button style="margin-top:8px;padding:5px 12px;border-radius:6px;font-size:11px;background:var(--input);color:var(--text2)" onclick="window.open(\'/clear-cache.html\',\'_blank\')">🧹 打开缓存清理页</button>';
  btn.disabled=false;
};
