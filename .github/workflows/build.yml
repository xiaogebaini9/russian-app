name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=" >> $GITHUB_ENV
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
          unzip -qo tools.zip
          mv cmdline-tools latest
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync

      - name: Prepare signing (if secrets configured)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASS" ]; then
            mkdir -p android/keystore
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > android/keystore/release.keystore
            printf 'storeFile=keystore/release.keystore\nstorePassword=%s\nkeyAlias=russian-app\nkeyPassword=%s\n' "$ANDROID_KEYSTORE_PASS" "$ANDROID_KEYSTORE_PASS" > android/keystore.properties
            echo "SIGNED_RELEASE=true" >> $GITHUB_ENV
            echo "签名密钥已就绪，将构建正式签名版"
          else
            echo "未配置签名密钥，回退 debug 版"
          fi

      - name: Build APK
        run: |
          unset ANDROID_SDK_ROOT
          cd android && chmod +x gradlew
          if [ "$SIGNED_RELEASE" = "true" ]; then
            ./gradlew assembleRelease -PciVersionCode=${{ github.run_number }} -PciVersionName=6.4.${{ github.run_number }}
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: russian-app-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "俄语学习 v${{ github.run_number }}"
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
